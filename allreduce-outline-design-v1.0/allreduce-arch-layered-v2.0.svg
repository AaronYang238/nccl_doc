<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1400" height="1000" fill="#fafafa"/>

  <!-- ===== Title ===== -->
  <text x="700" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">AllReduce 库 — 分层架构 v2.0（graph 单独成独立算法层）</text>
  <text x="700" y="52" text-anchor="middle" font-size="12" fill="#4b5563">(单机多卡 · Ring 算法 · Simple 协议 · 装配重 / 热路径轻)</text>

  <!-- ===== L1: API 层 ===== -->
  <g>
    <rect x="20" y="65" width="100" height="125" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="70" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">API 层</text>
    <text x="70" y="145" text-anchor="middle" font-size="10" fill="#7c2d12">C ABI 入口</text>
    <text x="70" y="161" text-anchor="middle" font-size="10" fill="#7c2d12">9 个公开符号</text>

    <rect x="140" y="65" width="1080" height="125" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="6"/>

    <rect x="160" y="85" width="280" height="85" fill="#fdba74" rx="4"/>
    <text x="300" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">生命周期 (3)</text>
    <text x="300" y="130" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommInit</text>
    <text x="300" y="145" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommDestroy</text>
    <text x="300" y="160" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommAbort</text>

    <rect x="455" y="85" width="280" height="85" fill="#fdba74" rx="4"/>
    <text x="595" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">集合通信 (1)</text>
    <text x="595" y="145" text-anchor="middle" font-size="12" fill="#7c2d12">ncclAllReduce</text>

    <rect x="750" y="85" width="450" height="85" fill="#fdba74" rx="4"/>
    <text x="975" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">查询 / 错误 (5)</text>
    <text x="975" y="130" text-anchor="middle" font-size="10" fill="#7c2d12">ncclCommCount · ncclCommUserRank</text>
    <text x="975" y="145" text-anchor="middle" font-size="10" fill="#7c2d12">ncclCommGetAsyncError</text>
    <text x="975" y="160" text-anchor="middle" font-size="10" fill="#7c2d12">ncclGetErrorString · ncclGetVersion</text>
  </g>

  <!-- ===== L2: 调度层 ===== -->
  <g>
    <rect x="20" y="205" width="100" height="105" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="6"/>
    <text x="70" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">调度层</text>
    <text x="70" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">enqueue</text>
    <text x="70" y="280" text-anchor="middle" font-size="9" fill="#78350f">热路径唯一 host 模块</text>
    <text x="70" y="294" text-anchor="middle" font-size="9" fill="#78350f">无运行时决策</text>

    <rect x="140" y="205" width="1080" height="105" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" rx="6"/>

    <rect x="160" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="272" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">① 参数校验</text>
    <text x="272" y="263" text-anchor="middle" font-size="9" fill="#78350f">comm / count / dtype / op</text>
    <text x="272" y="278" text-anchor="middle" font-size="9" fill="#78350f">comm-&gt;state == Active</text>

    <line x1="390" y1="257" x2="413" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="420,257 410,252 410,262" fill="#78350f"/>

    <rect x="425" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="537" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">② 查档位 + chunkSize</text>
    <text x="537" y="263" text-anchor="middle" font-size="9" fill="#78350f">字节数落档 → (nChannels, nThreads)</text>
    <text x="537" y="278" text-anchor="middle" font-size="9" fill="#78350f">buffSize / NCCL_STEPS × chunkSteps</text>

    <line x1="655" y1="257" x2="678" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="685,257 675,252 675,262" fill="#78350f"/>

    <rect x="690" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="802" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">③ 填 ncclWorkElem</text>
    <text x="802" y="263" text-anchor="middle" font-size="9" fill="#78350f">sendbuff / recvbuff / count</text>
    <text x="802" y="278" text-anchor="middle" font-size="9" fill="#78350f">chunkSize / nChannels / nThreads</text>

    <line x1="920" y1="257" x2="943" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="950,257 940,252 940,262" fill="#78350f"/>

    <rect x="955" y="225" width="245" height="65" fill="#fcd34d" rx="4"/>
    <text x="1077" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">④ dispatch + LaunchKernel</text>
    <text x="1077" y="263" text-anchor="middle" font-size="9" fill="#78350f">查 kernelTable[op][dtype]</text>
    <text x="1077" y="278" text-anchor="middle" font-size="9" fill="#78350f">grid=nChannels · block=nThreads</text>
  </g>

  <!-- ===== L3: GPU 内核层 ===== -->
  <g>
    <rect x="20" y="325" width="100" height="140" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
    <text x="70" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">GPU 内核层</text>
    <text x="70" y="413" text-anchor="middle" font-size="10" fill="#1e3a8a">GPU kernel</text>
    <text x="70" y="430" text-anchor="middle" font-size="10" fill="#1e3a8a">+ 通信原语 + reduce</text>

    <rect x="140" y="325" width="1080" height="140" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="6"/>

    <rect x="160" y="345" width="280" height="100" fill="#93c5fd" rx="4"/>
    <text x="300" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">allreduce_ring_simple.cu</text>
    <text x="300" y="404" text-anchor="middle" font-size="10" fill="#1e3a8a">Ring 两阶段循环 kernel</text>
    <text x="300" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">~68 实例 (op × dtype)</text>

    <rect x="455" y="345" width="220" height="100" fill="#93c5fd" rx="4"/>
    <text x="565" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">prims_simple.h</text>
    <text x="565" y="404" text-anchor="middle" font-size="10" fill="#1e3a8a">Simple 协议搬运</text>
    <text x="565" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">write + fence + tail</text>

    <rect x="690" y="345" width="220" height="100" fill="#93c5fd" rx="4"/>
    <text x="800" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">reduce_kernel.h</text>
    <text x="800" y="404" text-anchor="middle" font-size="10" fill="#1e3a8a">Sum / Max / Min / Prod / ...</text>
    <text x="800" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">fp32 accumulator (f16/bf16)</text>

    <rect x="925" y="345" width="280" height="100" fill="#93c5fd" rx="4"/>
    <text x="1065" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">common_kernel.h</text>
    <text x="1065" y="404" text-anchor="middle" font-size="10" fill="#1e3a8a">vector load / store</text>
    <text x="1065" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">__threadfence_system</text>
  </g>

  <!-- ===== L4: 传输层 (含装配期入口 + 运行期主体) ===== -->
  <g>
    <rect x="20" y="480" width="100" height="125" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
    <text x="70" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">传输层</text>
    <text x="70" y="553" text-anchor="middle" font-size="10" fill="#14532d">peer 间数据通路</text>
    <text x="70" y="572" text-anchor="middle" font-size="9" fill="#14532d">装配期入口 (虚线)</text>
    <text x="70" y="586" text-anchor="middle" font-size="9" fill="#14532d">+ 运行期主体 (实线)</text>

    <rect x="140" y="480" width="1080" height="125" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="6"/>

    <!-- 装配期入口 (lighter fill + dashed border) -->
    <rect x="160" y="500" width="340" height="85" fill="#bbf7d0" stroke="#14532d" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="330" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">transport.connect</text>
    <text x="330" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#14532d">[装配期入口 · 仅 commInit]</text>
    <text x="330" y="562" text-anchor="middle" font-size="9" fill="#14532d">selectTransport · cudaMalloc ringbuf</text>
    <text x="330" y="577" text-anchor="middle" font-size="9" fill="#14532d">交换 IPC handle · 映射对端 buffer</text>

    <rect x="520" y="500" width="340" height="85" fill="#86efac" rx="4"/>
    <text x="690" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">P2P 主路径</text>
    <text x="690" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#14532d">[运行期]</text>
    <text x="690" y="562" text-anchor="middle" font-size="9" fill="#14532d">CUDA IPC + PBLink / PCIe</text>
    <text x="690" y="577" text-anchor="middle" font-size="9" fill="#14532d">kernel 直接 store / load 远端 HBM</text>

    <rect x="880" y="500" width="320" height="85" fill="#86efac" rx="4"/>
    <text x="1040" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">SHM 备用路径</text>
    <text x="1040" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#14532d">[运行期]</text>
    <text x="1040" y="562" text-anchor="middle" font-size="9" fill="#14532d">/dev/shm mmap</text>
    <text x="1040" y="577" text-anchor="middle" font-size="9" fill="#14532d">cudaHostRegister + device 直访</text>
  </g>

  <!-- ===== L5: 算法层 (NEW · graph) ===== -->
  <g>
    <rect x="20" y="620" width="100" height="120" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="70" y="685" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">算法层</text>
    <text x="70" y="710" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">graph 模块</text>

    <rect x="140" y="620" width="1080" height="120" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" rx="6"/>

    <rect x="160" y="640" width="340" height="80" fill="#c4b5fd" rx="4"/>
    <text x="330" y="667" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">topo</text>
    <text x="330" y="687" text-anchor="middle" font-size="10" fill="#4c1d95">XML / NVML / sysfs 扫描</text>
    <text x="330" y="703" text-anchor="middle" font-size="9" fill="#4c1d95">输出: 拓扑树 + 链路类别 (PBLink/PCIe/...)</text>

    <rect x="520" y="640" width="340" height="80" fill="#c4b5fd" rx="4"/>
    <text x="690" y="667" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">search</text>
    <text x="690" y="687" text-anchor="middle" font-size="10" fill="#4c1d95">代价矩阵 + DFS / 贪心搜 Hamilton 环</text>
    <text x="690" y="703" text-anchor="middle" font-size="9" fill="#4c1d95">输出: prev / next 双向序列</text>

    <rect x="880" y="640" width="320" height="80" fill="#c4b5fd" rx="4"/>
    <text x="1040" y="667" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">ring 输出</text>
    <text x="1040" y="687" text-anchor="middle" font-size="10" fill="#4c1d95">双向 Ring (nChannels=2)</text>
    <text x="1040" y="703" text-anchor="middle" font-size="9" fill="#4c1d95">写入 comm-&gt;channels[*].ring</text>
  </g>

  <!-- ===== L6: 装配编排层 (gray · 仅生命周期 + 进程间 + 容器) ===== -->
  <g>
    <rect x="20" y="755" width="100" height="155" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="6"/>
    <text x="70" y="818" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">装配编排层</text>
    <text x="70" y="841" text-anchor="middle" font-size="10" fill="#1f2937">仅 init 期活跃</text>
    <text x="70" y="858" text-anchor="middle" font-size="9" fill="#1f2937">生命周期 + 进程间</text>
    <text x="70" y="872" text-anchor="middle" font-size="9" fill="#1f2937">同步 + 容器</text>

    <rect x="140" y="755" width="1080" height="155" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6"/>

    <rect x="160" y="775" width="340" height="115" fill="#d1d5db" rx="4"/>
    <text x="330" y="803" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">bootstrap</text>
    <text x="330" y="824" text-anchor="middle" font-size="10" fill="#1f2937">UDS 同步握手</text>
    <text x="330" y="842" text-anchor="middle" font-size="9" fill="#1f2937">所有 rank 会合于 UDSSocketPath</text>
    <text x="330" y="858" text-anchor="middle" font-size="9" fill="#1f2937">交换 peerInfo[]</text>
    <text x="330" y="876" text-anchor="middle" font-size="9" fill="#1f2937">每 rank 起常驻 udsListenPath</text>

    <rect x="520" y="775" width="340" height="115" fill="#d1d5db" rx="4"/>
    <text x="690" y="803" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">comm-init</text>
    <text x="690" y="824" text-anchor="middle" font-size="10" fill="#1f2937">状态机编排</text>
    <text x="690" y="842" text-anchor="middle" font-size="9" fill="#1f2937">Uninit → Bootstrapping</text>
    <text x="690" y="858" text-anchor="middle" font-size="9" fill="#1f2937">→ Discovering → Connecting</text>
    <text x="690" y="876" text-anchor="middle" font-size="9" fill="#1f2937">→ Active / Failed</text>

    <rect x="880" y="775" width="320" height="115" fill="#d1d5db" rx="4"/>
    <text x="1040" y="803" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">channel + devComm</text>
    <text x="1040" y="824" text-anchor="middle" font-size="10" fill="#1f2937">数据结构容器</text>
    <text x="1040" y="842" text-anchor="middle" font-size="9" fill="#1f2937">channels[].ring / peers</text>
    <text x="1040" y="858" text-anchor="middle" font-size="9" fill="#1f2937">打包 devComm 拷到 GPU HBM</text>
    <text x="1040" y="876" text-anchor="middle" font-size="9" fill="#1f2937">运行期 kernel 只读</text>
  </g>

  <!-- ===== Right vertical column: cross-cutting concerns ===== -->
  <g>
    <rect x="1240" y="65" width="140" height="845" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="6"/>
    <text x="1310" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#164e63">跨层服务</text>

    <rect x="1260" y="110" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">ringbuf 协议</text>
    <text x="1310" y="170" text-anchor="middle" font-size="9" fill="#164e63">head/tail 无锁推进</text>
    <text x="1310" y="186" text-anchor="middle" font-size="9" fill="#164e63">NCCL_STEPS = 8</text>

    <rect x="1260" y="225" width="100" height="90" fill="#67e8f9" rx="4"/>
    <text x="1310" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">CUDA stream</text>
    <text x="1310" y="285" text-anchor="middle" font-size="9" fill="#164e63">完成语义</text>
    <text x="1310" y="301" text-anchor="middle" font-size="9" fill="#164e63">由 stream 提供</text>

    <rect x="1260" y="330" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">异常逃生</text>
    <text x="1310" y="390" text-anchor="middle" font-size="9" fill="#164e63">fatalError</text>
    <text x="1310" y="406" text-anchor="middle" font-size="9" fill="#164e63">abortFlag</text>

    <rect x="1260" y="445" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">日志</text>
    <text x="1310" y="505" text-anchor="middle" font-size="9" fill="#164e63">NCCL_DEBUG</text>
    <text x="1310" y="521" text-anchor="middle" font-size="9" fill="#164e63">WARN / INFO / TRACE</text>

    <rect x="1260" y="560" width="100" height="80" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="595" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">NVTX</text>
    <text x="1310" y="620" text-anchor="middle" font-size="9" fill="#164e63">FUNC_RANGE</text>

    <rect x="1260" y="655" width="100" height="110" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="688" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">环境变量</text>
    <text x="1310" y="711" text-anchor="middle" font-size="9" fill="#164e63">NCCL_DEBUG</text>
    <text x="1310" y="727" text-anchor="middle" font-size="9" fill="#164e63">NCCL_P2P_DISABLE</text>
    <text x="1310" y="743" text-anchor="middle" font-size="9" fill="#164e63">NCCL_SHM_DISABLE</text>

    <rect x="1260" y="780" width="100" height="100" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="815" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">拓扑导出</text>
    <text x="1310" y="840" text-anchor="middle" font-size="9" fill="#164e63">NCCL_TOPO_FILE</text>
    <text x="1310" y="856" text-anchor="middle" font-size="9" fill="#164e63">TOPO_DUMP_FILE</text>
  </g>

  <!-- ===== Dashed dividers between layers ===== -->
  <line x1="20" y1="197" x2="1220" y2="197" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="317" x2="1220" y2="317" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="472" x2="1220" y2="472" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="612" x2="1220" y2="612" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="747" x2="1220" y2="747" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===== Caption ===== -->
  <text x="20" y="943" font-size="11" fill="#666">数据流: API ↓ 调度 ↓ GPU 内核 ↔ 传输 (运行期主体) — transport.connect / 算法层 / 装配编排层 仅 commInit 期活跃 — 右侧跨层服务伴随 communicator 全生命周期</text>
  <text x="20" y="961" font-size="11" fill="#666">色块: 🟠 API · 🟡 调度 · 🔵 GPU 内核 · 🟢 传输 · 🟣 算法 · ⚫ 装配编排 · 🔵 跨层服务   ·   设计原则: 装配重 / 热路径轻</text>
  <text x="20" y="983" font-size="10" font-style="italic" fill="#888">v2.0 vs v1.0 变化: graph 从装配层抽出为独立算法层;装配层只剩生命周期编排 + 进程间握手 + 容器;transport.connect 虚线框 = 同一份代码的装配期入口,产物供传输层运行期主体使用</text>
</svg>
