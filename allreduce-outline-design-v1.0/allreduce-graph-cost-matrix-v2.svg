<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="400" height="450" fill="#fafafa"/>
  <g transform="translate(-440, -60)">
    <rect x="450" y="70" width="380" height="430" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="6"/>
    <text x="640" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">cost[N][N] 代价矩阵（中间产物）</text>
    <text x="640" y="113" text-anchor="middle" font-size="9" font-style="italic" fill="#312e81">N=4 示例：2 PBLink-pair + 跨 NUMA 边</text>

    <rect x="475" y="130" width="330" height="125" fill="#ffffff" stroke="#a5b4fc" stroke-width="1" rx="3"/>

    <line x1="540" y1="138" x2="540" y2="247" stroke="#c7d2fe" stroke-width="0.5"/>
    <line x1="485" y1="160" x2="795" y2="160" stroke="#c7d2fe" stroke-width="0.5"/>

    <rect x="551" y="168" width="28" height="16" fill="#fbbf24" fill-opacity="0.35" rx="2"/>
    <rect x="611" y="186" width="28" height="16" fill="#fbbf24" fill-opacity="0.35" rx="2"/>
    <rect x="671" y="204" width="28" height="16" fill="#fbbf24" fill-opacity="0.35" rx="2"/>
    <rect x="731" y="222" width="28" height="16" fill="#fbbf24" fill-opacity="0.35" rx="2"/>

    <rect x="611" y="168" width="28" height="16" fill="#34d399" fill-opacity="0.45" rx="2"/>
    <rect x="671" y="186" width="28" height="16" fill="#34d399" fill-opacity="0.45" rx="2"/>
    <rect x="731" y="204" width="28" height="16" fill="#34d399" fill-opacity="0.45" rx="2"/>
    <rect x="551" y="222" width="28" height="16" fill="#34d399" fill-opacity="0.45" rx="2"/>

    <g font-family="'Consolas','SF Mono','Menlo',monospace" font-size="11" font-weight="bold" fill="#312e81">
      <text x="565" y="154" text-anchor="middle">r0</text>
      <text x="625" y="154" text-anchor="middle">r1</text>
      <text x="685" y="154" text-anchor="middle">r2</text>
      <text x="745" y="154" text-anchor="middle">r3</text>
    </g>

    <g font-family="'Consolas','SF Mono','Menlo',monospace" font-size="11" font-weight="bold" fill="#312e81">
      <text x="510" y="180" text-anchor="middle">r0</text>
      <text x="510" y="198" text-anchor="middle">r1</text>
      <text x="510" y="216" text-anchor="middle">r2</text>
      <text x="510" y="234" text-anchor="middle">r3</text>
    </g>

    <g font-family="'Consolas','SF Mono','Menlo',monospace" font-size="11" fill="#312e81">
      <text x="565" y="180" text-anchor="middle">0</text>
      <text x="625" y="180" text-anchor="middle">1</text>
      <text x="685" y="180" text-anchor="middle">5</text>
      <text x="745" y="180" text-anchor="middle">50</text>
      <text x="565" y="198" text-anchor="middle">1</text>
      <text x="625" y="198" text-anchor="middle">0</text>
      <text x="685" y="198" text-anchor="middle">5</text>
      <text x="745" y="198" text-anchor="middle">50</text>
      <text x="565" y="216" text-anchor="middle">5</text>
      <text x="625" y="216" text-anchor="middle">5</text>
      <text x="685" y="216" text-anchor="middle">0</text>
      <text x="745" y="216" text-anchor="middle">1</text>
      <text x="565" y="234" text-anchor="middle">50</text>
      <text x="625" y="234" text-anchor="middle">50</text>
      <text x="685" y="234" text-anchor="middle">1</text>
      <text x="745" y="234" text-anchor="middle">0</text>
    </g>

    <text x="475" y="275" font-size="10" fill="#312e81">↑ 黄色高亮：对角线 cost[i][i] = 0（不参与搜索）</text>
    <text x="475" y="291" font-size="10" fill="#312e81">↑ 绿色高亮：示例贪心选中的 4 条边（环 0→1→2→3→0）</text>
    <text x="475" y="307" font-size="10" fill="#312e81">↑ ∞ 边：剩余带宽 = 0 时 cost 升至 INT_MAX，贪心自动跳过</text>

    <text x="475" y="330" font-size="11" font-weight="bold" fill="#065f46">贪心 + 2-opt 搜索 + 链路带宽消耗（每 channel 占 50% 示例）：</text>
    <g font-size="9.5" fill="#065f46">
      <text x="475" y="348">① 贪心选 r0→r1：cost = 1，acc = 1；消耗 50% → cost[0][1] ← 2</text>
      <text x="475" y="364">② 贪心选 r1→r2：cost = 5，acc = 6；消耗 50% → cost[1][2] ← 10</text>
      <text x="475" y="380">③ 贪心选 r2→r3：cost = 1，acc = 7；消耗 50% → cost[2][3] ← 2</text>
      <text x="475" y="396">④ 闭环 r3→r0：cost = 50，acc = 57；消耗 50% → cost[3][0] ← 100</text>
    </g>

    <text x="475" y="422" font-size="11" font-weight="bold" fill="#312e81">代价值含义 &amp; 链路带宽消耗原则：</text>
    <g font-size="9.5" fill="#312e81">
      <text x="475" y="440">1 = PBLink direct | 5 = 同 switch | 10 = 同 CPU | 50 = 跨 NUMA | ∞ = 不可达</text>
      <text x="475" y="456">• 每选一边按"已用带宽比例"提升其 cost（剩余越少 cost 越高）</text>
      <text x="475" y="472">• 同一物理链路可被多次选用，但 cost 累计上涨直至带宽耗尽 → ∞</text>
      <text x="475" y="488">• 2-opt 交换时同步恢复换出边带宽、消耗换入边带宽</text>
    </g>
  </g>
</svg>
