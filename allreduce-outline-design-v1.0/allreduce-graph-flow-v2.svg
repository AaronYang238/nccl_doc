<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="830" fill="#fafafa"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="640" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">graph 模块 — commInit 执行流程</text>
  <text x="640" y="58" text-anchor="middle" font-size="12" fill="#4b5563">7 步装配产出双向 Ring 序列；数据结构定义见 allreduce-graph-datastructures.svg</text>

  <!-- ===== Step 1 ===== -->
  <g>
    <rect x="250" y="90" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="115" font-size="14" font-weight="bold" fill="#4c1d95">① 获取 XML 拓扑文件</text>
    <text x="280" y="133" font-size="10" fill="#4c1d95">从约定路径或 NCCL_TOPO_FILE 环境变量读取 XML，不存在则现场调 NVML / sysfs 扫描生成并落盘。</text>
  </g>
  <g>
    <rect x="950" y="100" width="270" height="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">格式非法或扫描失败</text>
    <text x="1085" y="127" text-anchor="middle" font-size="8" fill="#991b1b">装配失败 (ncclInternalError)</text>
  </g>
  <line x1="910" y1="115" x2="950" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="140" x2="580" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 2 ===== -->
  <g>
    <rect x="250" y="170" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="195" font-size="14" font-weight="bold" fill="#4c1d95">② GPU 枚举与对齐</text>
    <text x="280" y="213" font-size="10" fill="#4c1d95">按 busId 把每个 rank 与 XML 中的 GPU 节点对齐，建立 rank 到拓扑节点的映射表。</text>
  </g>
  <g>
    <rect x="950" y="180" width="270" height="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="195" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">rank 或 device 不在 XML</text>
    <text x="1085" y="207" text-anchor="middle" font-size="8" fill="#991b1b">环境不匹配，装配失败</text>
  </g>
  <line x1="910" y1="195" x2="950" y2="195" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="220" x2="580" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 3 ===== -->
  <g>
    <rect x="250" y="250" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="275" font-size="14" font-weight="bold" fill="#4c1d95">③ 填代价矩阵 cost[N][N]</text>
    <text x="280" y="293" font-size="10" fill="#4c1d95">按每对 GPU 的物理连接类型（PBLink 直连 / 同 PCIe switch / 同 CPU / 跨 NUMA / 不可达）分别填代价 1 / 5 / 10 / 50 / ∞。</text>
  </g>

  <line x1="580" y1="300" x2="580" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 4 ===== -->
  <g>
    <rect x="250" y="330" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="355" font-size="14" font-weight="bold" fill="#4c1d95">④ Ring 搜索（最小代价 Hamilton 环）</text>
    <text x="280" y="373" font-size="10" fill="#4c1d95">在代价矩阵上用贪心 + 2-opt 算法搜出总代价最低的 Hamilton 环。</text>
  </g>
  <g>
    <rect x="950" y="340" width="270" height="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="355" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">所有 Hamilton 环都含 ∞ 边</text>
    <text x="1085" y="367" text-anchor="middle" font-size="8" fill="#991b1b">搜索耗尽，装配失败</text>
  </g>
  <line x1="910" y1="355" x2="950" y2="355" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="380" x2="580" y2="410" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 5 ===== -->
  <g>
    <rect x="250" y="410" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="435" font-size="14" font-weight="bold" fill="#4c1d95">⑤ 确定边上使用的 transport 后端</text>
    <text x="280" y="453" font-size="10" fill="#4c1d95">逐边检查：cost &lt; ∞ 的边运行期走 P2P，cost = ∞ 的边标记需降级走 SHM；需降级边超阈值时装配失败。</text>
  </g>
  <g>
    <rect x="950" y="420" width="270" height="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="435" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">需降级边超过阈值</text>
    <text x="1085" y="447" text-anchor="middle" font-size="8" fill="#991b1b">P2P 几乎完全失效，装配失败</text>
  </g>
  <line x1="910" y1="435" x2="950" y2="435" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="460" x2="580" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 6 ===== -->
  <g>
    <rect x="250" y="490" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="515" font-size="14" font-weight="bold" fill="#4c1d95">⑥ 双向 Ring 输出（nChannels = 2）</text>
    <text x="280" y="533" font-size="10" fill="#4c1d95">生成前向与反向两份 Ring 序列（反向由前向的 prev / next 互换并把 userRanks 翻转得到），让 PBLink 双向同时跑满。</text>
  </g>

  <line x1="580" y1="540" x2="580" y2="570" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 7 ===== -->
  <g>
    <rect x="250" y="570" width="660" height="50" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="595" font-size="14" font-weight="bold" fill="#4c1d95">⑦ 结果落地</text>
    <text x="280" y="613" font-size="10" fill="#4c1d95">把两份 ring 序列写入 comm-&gt;channels[0..1].ring，装配后固化，运行期只读不写。</text>
  </g>

  <line x1="580" y1="620" x2="580" y2="650" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Output ===== -->
  <g>
    <rect x="250" y="650" width="660" height="55" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="580" y="673" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">输出：comm-&gt;channels[0..1].ring</text>
    <text x="580" y="693" text-anchor="middle" font-size="10" fill="#7c2d12">{ prev, next, userRanks[] } × 2（前向 + 反向），装配后固化，运行期只读</text>
  </g>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="100" y="730" width="1080" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
    <text x="120" y="755" font-size="11" font-weight="bold" fill="#374151">图例：</text>

    <rect x="170" y="745" width="20" height="14" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="200" y="757" font-size="10" fill="#374151">执行步骤</text>

    <rect x="280" y="745" width="20" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="310" y="757" font-size="10" fill="#374151">失败分支（虚线 + 红边）</text>

    <rect x="470" y="745" width="20" height="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="500" y="757" font-size="10" fill="#374151">输出</text>

    <text x="120" y="785" font-size="10" fill="#6b7280">关键性质：7 步全部在 commInit 期间执行一次，运行期 graph 模块不再活跃；任一步失败将 comm-&gt;state 置为 Failed，需 commDestroy 后重新 commInit。</text>
  </g>

</svg>
