<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1300" height="560" fill="#fafafa"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="650" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">AllReduce 库 — 外部接口与运行环境</text>
  <text x="650" y="52" text-anchor="middle" font-size="12" fill="#4b5563">(对外:调用方 · CUDA Runtime · GPU 硬件 · host 共享内存备用)</text>

  <!-- ===== 1. Caller Layer (上游) ===== -->
  <g>
    <rect x="80" y="78" width="1140" height="92" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
    <text x="650" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">调用方（上游）— DL 训练 / 推理框架 · 测试驱动</text>

    <rect x="100" y="113" width="200" height="48" fill="#fca5a5" rx="4"/>
    <text x="200" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">PyTorch</text>
    <text x="200" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">DDP / FSDP</text>

    <rect x="320" y="113" width="200" height="48" fill="#fca5a5" rx="4"/>
    <text x="420" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Megatron-LM</text>
    <text x="420" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">TP / PP</text>

    <rect x="540" y="113" width="200" height="48" fill="#fca5a5" rx="4"/>
    <text x="640" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">DeepSpeed</text>
    <text x="640" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">ZeRO</text>

    <rect x="760" y="113" width="200" height="48" fill="#fca5a5" rx="4"/>
    <text x="860" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">nccl-tests</text>
    <text x="860" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">性能基准</text>

    <rect x="980" y="113" width="220" height="48" fill="#fca5a5" rx="4"/>
    <text x="1090" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">自定义 driver</text>
    <text x="1090" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">微基准 / 集成测试</text>
  </g>

  <!-- Arrow down with C ABI label -->
  <line x1="650" y1="170" x2="650" y2="230" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-solid)"/>
  <rect x="450" y="186" width="400" height="22" fill="#fafafa"/>
  <text x="650" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">C ABI · 9 个公开符号 · 入队即返回 · 完成由 stream 提供</text>

  <!-- ===== 2. AllReduce Library (central, simplified — no internal layers) ===== -->
  <g>
    <rect x="280" y="240" width="740" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" rx="10"/>
    <text x="650" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">AllReduce 库（本系统）</text>
    <text x="650" y="293" text-anchor="middle" font-size="11" fill="#1e3a8a">单机多卡 · Ring 算法 · Simple 协议</text>
    <text x="650" y="310" text-anchor="middle" font-size="10" font-style="italic" fill="#1e3a8a">— 内部分层与模块详见 §5 总体架构（图 5-1）</text>
  </g>

  <!-- Three downstream arrows -->
  <line x1="430" y1="320" x2="240" y2="378" stroke="#374151" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <rect x="200" y="335" width="200" height="20" fill="#fafafa"/>
  <text x="300" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">cudaLaunchKernel · cudaIpc*</text>

  <line x1="650" y1="320" x2="650" y2="378" stroke="#374151" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <rect x="535" y="335" width="230" height="20" fill="#fafafa"/>
  <text x="650" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">GPU 显存读写 · IPC handle 共享</text>

  <line x1="870" y1="320" x2="1060" y2="378" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-fallback)"/>
  <rect x="900" y="335" width="220" height="20" fill="#fafafa"/>
  <text x="1010" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">mmap /dev/shm (备用)</text>

  <!-- ===== 3a. CUDA Runtime + Driver (condensed) ===== -->
  <g>
    <rect x="80" y="385" width="320" height="115" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
    <text x="240" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CUDA Runtime + Driver</text>
    <text x="240" y="436" text-anchor="middle" font-size="10" fill="#14532d">cudaLaunchKernel · cudaMalloc</text>
    <text x="240" y="454" text-anchor="middle" font-size="10" fill="#14532d">cudaIpc* · cudaStream*</text>
  </g>

  <!-- ===== 3b. GPU 硬件互联 (condensed) ===== -->
  <g>
    <rect x="420" y="385" width="460" height="115" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="8"/>
    <text x="650" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">GPU 硬件互联</text>

    <rect x="440" y="425" width="135" height="65" fill="#fdba74" rx="4"/>
    <text x="507" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">PBLink</text>
    <text x="507" y="468" text-anchor="middle" font-size="10" fill="#7c2d12">主路径</text>
    <text x="507" y="482" text-anchor="middle" font-size="9" fill="#7c2d12">高带宽 peer 通路</text>

    <rect x="585" y="425" width="135" height="65" fill="#fdba74" rx="4"/>
    <text x="652" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">PCIe</text>
    <text x="652" y="468" text-anchor="middle" font-size="10" fill="#7c2d12">次选回退</text>
    <text x="652" y="482" text-anchor="middle" font-size="9" fill="#7c2d12">无 PBLink 时启用</text>

    <rect x="730" y="425" width="135" height="65" fill="#fdba74" rx="4"/>
    <text x="797" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">CUDA IPC</text>
    <text x="797" y="468" text-anchor="middle" font-size="10" fill="#7c2d12">跨进程显存映射</text>
    <text x="797" y="482" text-anchor="middle" font-size="9" fill="#7c2d12">handle 经 UDS 传</text>
  </g>

  <!-- ===== 3c. host /dev/shm (fallback, condensed) ===== -->
  <g>
    <rect x="900" y="385" width="320" height="115" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 3" rx="8"/>
    <text x="1060" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">host 共享内存（备用）</text>
    <text x="1060" y="436" text-anchor="middle" font-size="10" fill="#4c1d95">/dev/shm mmap</text>
    <text x="1060" y="454" text-anchor="middle" font-size="10" fill="#4c1d95">IPC 不可达时退化</text>
    <text x="1060" y="482" text-anchor="middle" font-size="9" font-style="italic" fill="#4c1d95">带宽显著低于 PBLink</text>
  </g>

  <!-- Caption -->
  <text x="80" y="540" font-size="11" fill="#666">数据流方向:调用方 → C ABI → AllReduce 库 → CUDA Runtime → GPU 硬件 (PBLink / PCIe / IPC);  CUDA IPC 不可达时退化到 /dev/shm</text>
</svg>
