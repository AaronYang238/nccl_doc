<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1400" height="920" fill="#fafafa"/>

  <!-- ===== Title ===== -->
  <text x="700" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">AllReduce 库 — 分层架构与模块关系</text>
  <text x="700" y="52" text-anchor="middle" font-size="12" fill="#4b5563">(单机多卡 · Ring 算法 · Simple 协议)</text>

  <!-- ===== 1. API Layer ===== -->
  <g>
    <rect x="20" y="65" width="100" height="130" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="70" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">API 层</text>
    <text x="70" y="142" text-anchor="middle" font-size="10" fill="#7c2d12">C ABI 入口</text>
    <text x="70" y="158" text-anchor="middle" font-size="10" fill="#7c2d12">9 个公开符号</text>
    <text x="70" y="174" text-anchor="middle" font-size="10" fill="#7c2d12">nccl.h</text>

    <rect x="140" y="65" width="1080" height="130" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="6"/>

    <rect x="160" y="90" width="280" height="80" fill="#fdba74" rx="4"/>
    <text x="300" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">生命周期 (3)</text>
    <text x="300" y="133" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommInit</text>
    <text x="300" y="148" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommDestroy</text>
    <text x="300" y="163" text-anchor="middle" font-size="11" fill="#7c2d12">ncclCommAbort</text>

    <rect x="455" y="90" width="280" height="80" fill="#fdba74" rx="4"/>
    <text x="595" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">集合通信 (1)</text>
    <text x="595" y="140" text-anchor="middle" font-size="12" fill="#7c2d12">ncclAllReduce</text>
    <text x="595" y="158" text-anchor="middle" font-size="10" fill="#7c2d12">sendbuf → recvbuf · 求和归约</text>

    <rect x="750" y="90" width="450" height="80" fill="#fdba74" rx="4"/>
    <text x="975" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">查询 / 错误 (5)</text>
    <text x="975" y="133" text-anchor="middle" font-size="10" fill="#7c2d12">ncclCommCount   ·   ncclCommUserRank</text>
    <text x="975" y="148" text-anchor="middle" font-size="10" fill="#7c2d12">ncclCommGetAsyncError</text>
    <text x="975" y="163" text-anchor="middle" font-size="10" fill="#7c2d12">ncclGetErrorString   ·   ncclGetVersion</text>
  </g>

  <!-- ===== 2. Scheduler Layer ===== -->
  <g>
    <rect x="20" y="210" width="100" height="110" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="6"/>
    <text x="70" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">调度层</text>
    <text x="70" y="275" text-anchor="middle" font-size="10" fill="#78350f">单次 AllReduce</text>
    <text x="70" y="293" text-anchor="middle" font-size="10" fill="#78350f">统一调度 (host 侧)</text>

    <rect x="140" y="210" width="1080" height="110" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" rx="6"/>

    <rect x="160" y="230" width="240" height="70" fill="#fcd34d" rx="4"/>
    <text x="280" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">enqueueCheck</text>
    <text x="280" y="275" text-anchor="middle" font-size="10" fill="#78350f">参数校验</text>
    <text x="280" y="290" text-anchor="middle" font-size="10" fill="#78350f">同步单路径</text>

    <rect x="415" y="230" width="240" height="70" fill="#fcd34d" rx="4"/>
    <text x="535" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">pickChunkSize</text>
    <text x="535" y="275" text-anchor="middle" font-size="10" fill="#78350f">按消息大小查表</text>
    <text x="535" y="290" text-anchor="middle" font-size="10" fill="#78350f">选 nChannels</text>

    <rect x="670" y="230" width="240" height="70" fill="#fcd34d" rx="4"/>
    <text x="790" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">setupCollKernel</text>
    <text x="790" y="275" text-anchor="middle" font-size="10" fill="#78350f">填 WorkElem</text>
    <text x="790" y="290" text-anchor="middle" font-size="10" fill="#78350f">分 channel 切片</text>

    <rect x="925" y="230" width="280" height="70" fill="#fcd34d" rx="4"/>
    <text x="1065" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">launchKernel</text>
    <text x="1065" y="275" text-anchor="middle" font-size="10" fill="#78350f">cudaLaunchKernel</text>
    <text x="1065" y="290" text-anchor="middle" font-size="10" fill="#78350f">直接投递 GPU</text>
  </g>

  <!-- ===== 3. GPU Kernel Layer ===== -->
  <g>
    <rect x="20" y="335" width="100" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
    <text x="70" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">GPU 内核层</text>
    <text x="70" y="418" text-anchor="middle" font-size="10" fill="#1e3a8a">GPU kernel</text>
    <text x="70" y="436" text-anchor="middle" font-size="10" fill="#1e3a8a">+ 通信原语</text>
    <text x="70" y="454" text-anchor="middle" font-size="10" fill="#1e3a8a">+ reduce 函数</text>

    <rect x="140" y="335" width="1080" height="150" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="6"/>

    <rect x="160" y="355" width="280" height="110" fill="#93c5fd" rx="4"/>
    <text x="300" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">allreduce_ring_simple.cu</text>
    <text x="300" y="400" text-anchor="middle" font-size="10" fill="#1e3a8a">Ring 两阶段循环 kernel</text>
    <text x="300" y="418" text-anchor="middle" font-size="10" fill="#1e3a8a">1 个模板</text>
    <text x="300" y="436" text-anchor="middle" font-size="10" fill="#1e3a8a">AllReduce × Ring × Simple</text>
    <text x="300" y="452" text-anchor="middle" font-size="10" fill="#1e3a8a">× Sum × float32</text>

    <rect x="455" y="355" width="220" height="110" fill="#93c5fd" rx="4"/>
    <text x="565" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">prims_simple.h</text>
    <text x="565" y="403" text-anchor="middle" font-size="10" fill="#1e3a8a">Simple 协议搬运</text>
    <text x="565" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">write + fence + tail</text>
    <text x="565" y="437" text-anchor="middle" font-size="10" fill="#1e3a8a">NCCL_STEPS = 8</text>
    <text x="565" y="454" text-anchor="middle" font-size="10" fill="#1e3a8a">(流水深度)</text>

    <rect x="690" y="355" width="220" height="110" fill="#93c5fd" rx="4"/>
    <text x="800" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">reduce_kernel.h</text>
    <text x="800" y="403" text-anchor="middle" font-size="10" fill="#1e3a8a">FuncSum / float32</text>
    <text x="800" y="423" text-anchor="middle" font-size="10" fill="#1e3a8a">模板可扩</text>
    <text x="800" y="439" text-anchor="middle" font-size="10" fill="#1e3a8a">Prod / Max / Min / Avg</text>
    <text x="800" y="455" text-anchor="middle" font-size="10" fill="#1e3a8a">+ 多 dtype</text>

    <rect x="925" y="355" width="280" height="110" fill="#93c5fd" rx="4"/>
    <text x="1065" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">common_kernel.h</text>
    <text x="1065" y="403" text-anchor="middle" font-size="10" fill="#1e3a8a">4-elem vector load / store</text>
    <text x="1065" y="420" text-anchor="middle" font-size="10" fill="#1e3a8a">__threadfence_system</text>
    <text x="1065" y="437" text-anchor="middle" font-size="10" fill="#1e3a8a">spin-wait 原语</text>
  </g>

  <!-- ===== 4. Transport Layer ===== -->
  <g>
    <rect x="20" y="500" width="100" height="130" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
    <text x="70" y="555" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">传输层</text>
    <text x="70" y="575" text-anchor="middle" font-size="10" fill="#14532d">peer 间数据通路</text>
    <text x="70" y="593" text-anchor="middle" font-size="10" fill="#14532d">2 个后端 · 条件分支</text>

    <rect x="140" y="500" width="1080" height="130" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="6"/>

    <rect x="160" y="520" width="330" height="90" fill="#86efac" rx="4"/>
    <text x="325" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">selectTransport</text>
    <text x="325" y="565" text-anchor="middle" font-size="10" fill="#14532d">优先 P2P → 降级 SHM</text>
    <text x="325" y="580" text-anchor="middle" font-size="10" fill="#14532d">两者都不可用 → 装配失败</text>
    <text x="325" y="598" text-anchor="middle" font-size="9" fill="#14532d">条件分支选择，简洁直观</text>

    <rect x="510" y="520" width="330" height="90" fill="#86efac" rx="4"/>
    <text x="675" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">P2P (主路径)</text>
    <text x="675" y="565" text-anchor="middle" font-size="10" fill="#14532d">CUDA IPC + NVLink</text>
    <text x="675" y="580" text-anchor="middle" font-size="10" fill="#14532d">device store / load 直接搬运</text>
    <text x="675" y="598" text-anchor="middle" font-size="9" fill="#14532d">同节点 GPU 间高带宽通路</text>

    <rect x="860" y="520" width="330" height="90" fill="#86efac" rx="4"/>
    <text x="1025" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">SHM (备用路径)</text>
    <text x="1025" y="565" text-anchor="middle" font-size="10" fill="#14532d">/dev/shm mmap</text>
    <text x="1025" y="580" text-anchor="middle" font-size="10" fill="#14532d">IPC 不可达时退化</text>
    <text x="1025" y="598" text-anchor="middle" font-size="9" fill="#14532d">host 内存中转，兼容性备用</text>
  </g>

  <!-- ===== 5. Assembly Layer (graph & topology + base) ===== -->
  <g>
    <rect x="20" y="645" width="100" height="220" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="70" y="725" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">装配层</text>
    <text x="70" y="748" text-anchor="middle" font-size="10" fill="#4c1d95">仅 init 期活跃</text>
    <text x="70" y="766" text-anchor="middle" font-size="10" fill="#4c1d95">热路径不参与</text>
    <text x="70" y="788" text-anchor="middle" font-size="10" fill="#4c1d95">拓扑 + 算法图</text>
    <text x="70" y="804" text-anchor="middle" font-size="10" fill="#4c1d95">+ 建连 + 运行时基础</text>

    <rect x="140" y="645" width="1080" height="220" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" rx="6"/>

    <text x="158" y="680" font-size="10" font-style="italic" fill="#6d28d9">— 拓扑 / 算法图构造</text>

    <rect x="160" y="690" width="330" height="75" fill="#c4b5fd" rx="4"/>
    <text x="325" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">topo</text>
    <text x="325" y="732" text-anchor="middle" font-size="10" fill="#4c1d95">GPU / NVLink / PCIe / IPC</text>
    <text x="325" y="748" text-anchor="middle" font-size="10" fill="#4c1d95">可达性扫描</text>

    <rect x="510" y="690" width="330" height="75" fill="#c4b5fd" rx="4"/>
    <text x="675" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">search</text>
    <text x="675" y="732" text-anchor="middle" font-size="10" fill="#4c1d95">按 busId 排序成环</text>
    <text x="675" y="748" text-anchor="middle" font-size="10" fill="#4c1d95">朴素 Ring 构造</text>

    <rect x="860" y="690" width="330" height="75" fill="#c4b5fd" rx="4"/>
    <text x="1025" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">connect</text>
    <text x="1025" y="732" text-anchor="middle" font-size="10" fill="#4c1d95">建连准备 · 填 channels</text>
    <text x="1025" y="748" text-anchor="middle" font-size="10" fill="#4c1d95">分发 IPC handle + ringbuf 指针</text>

    <text x="158" y="785" font-size="10" font-style="italic" fill="#6d28d9">— 运行时基础</text>

    <rect x="160" y="795" width="330" height="60" fill="#c4b5fd" rx="4"/>
    <text x="325" y="816" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">bootstrap</text>
    <text x="325" y="832" text-anchor="middle" font-size="10" fill="#4c1d95">文件 / UDS rendezvous</text>
    <text x="325" y="846" text-anchor="middle" font-size="10" fill="#4c1d95">线性 N 次 read / write 交换 peerInfo</text>

    <rect x="510" y="795" width="330" height="60" fill="#c4b5fd" rx="4"/>
    <text x="675" y="816" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">channel</text>
    <text x="675" y="832" text-anchor="middle" font-size="10" fill="#4c1d95">initChannel</text>
    <text x="675" y="846" text-anchor="middle" font-size="10" fill="#4c1d95">workFifo 分配</text>

    <rect x="860" y="795" width="330" height="60" fill="#c4b5fd" rx="4"/>
    <text x="1025" y="816" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">init / commLifecycle</text>
    <text x="1025" y="832" text-anchor="middle" font-size="10" fill="#4c1d95">状态机编排</text>
    <text x="1025" y="846" text-anchor="middle" font-size="10" fill="#4c1d95">commAlloc / Free / Poison</text>
  </g>

  <!-- ===== Right vertical column: cross-cutting concerns ===== -->
  <g>
    <rect x="1240" y="65" width="140" height="800" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="6"/>
    <text x="1310" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#164e63">跨层服务</text>

    <rect x="1260" y="110" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">ringbuf 协议</text>
    <text x="1310" y="154" text-anchor="middle" font-size="9" fill="#164e63">head / tail / step</text>
    <text x="1310" y="170" text-anchor="middle" font-size="9" fill="#164e63">NCCL_STEPS = 8</text>
    <text x="1310" y="186" text-anchor="middle" font-size="9" fill="#164e63">head/tail 无锁推进</text>
    <text x="1310" y="202" text-anchor="middle" font-size="9" fill="#164e63">运行期数据通路</text>

    <rect x="1260" y="222" width="100" height="86" fill="#67e8f9" rx="4"/>
    <text x="1310" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">CUDA stream</text>
    <text x="1310" y="266" text-anchor="middle" font-size="9" fill="#164e63">doneEvent</text>
    <text x="1310" y="282" text-anchor="middle" font-size="9" fill="#164e63">完成语义由 stream 提供</text>
    <text x="1310" y="298" text-anchor="middle" font-size="9" fill="#164e63">API 入队即返回</text>

    <rect x="1260" y="320" width="100" height="90" fill="#67e8f9" rx="4"/>
    <text x="1310" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">异常逃生</text>
    <text x="1310" y="364" text-anchor="middle" font-size="9" fill="#164e63">fatalError</text>
    <text x="1310" y="380" text-anchor="middle" font-size="9" fill="#164e63">abortFlag</text>
    <text x="1310" y="396" text-anchor="middle" font-size="9" fill="#164e63">GetAsyncError 轮询</text>

    <rect x="1260" y="422" width="100" height="86" fill="#67e8f9" rx="4"/>
    <text x="1310" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">日志</text>
    <text x="1310" y="466" text-anchor="middle" font-size="9" fill="#164e63">NCCL_DEBUG</text>
    <text x="1310" y="482" text-anchor="middle" font-size="9" fill="#164e63">WARN / INFO / TRACE</text>
    <text x="1310" y="498" text-anchor="middle" font-size="9" fill="#164e63">SUBSYS 过滤</text>

    <rect x="1260" y="520" width="100" height="80" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="543" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">NVTX</text>
    <text x="1310" y="564" text-anchor="middle" font-size="9" fill="#164e63">FUNC_RANGE</text>
    <text x="1310" y="580" text-anchor="middle" font-size="9" fill="#164e63">Nsight 时间线标注</text>

    <rect x="1260" y="612" width="100" height="90" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">环境变量</text>
    <text x="1310" y="656" text-anchor="middle" font-size="9" fill="#164e63">NCCL_DEBUG</text>
    <text x="1310" y="672" text-anchor="middle" font-size="9" fill="#164e63">NCCL_P2P_DISABLE</text>
    <text x="1310" y="688" text-anchor="middle" font-size="9" fill="#164e63">NCCL_SHM_DISABLE</text>

    <rect x="1260" y="714" width="100" height="80" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="737" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">拓扑导出</text>
    <text x="1310" y="758" text-anchor="middle" font-size="9" fill="#164e63">TOPO_DUMP_FILE</text>
    <text x="1310" y="774" text-anchor="middle" font-size="9" fill="#164e63">(调试用)</text>
  </g>

  <!-- ===== Dashed dividers between layers ===== -->
  <line x1="20" y1="202" x2="1220" y2="202" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="327" x2="1220" y2="327" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="492" x2="1220" y2="492" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="637" x2="1220" y2="637" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===== Caption ===== -->
  <text x="20" y="890" font-size="11" fill="#666">数据流方向:API ↓ 调度层 ↓ GPU 内核层 ↔ 传输层(运行期数据通路) — 装配层仅 commInit 期活跃 — 右侧跨层服务伴随 communicator 全生命周期</text>
  <text x="20" y="908" font-size="11" fill="#666">色块对照:🟠 API 层  🟡 调度层  🔵 GPU 内核层  🟢 传输层  🟣 装配层  🔵 跨层服务   ·   设计原则:装配重 / 热路径轻 · 三层正交组合 · communicator 不可变</text>
</svg>
