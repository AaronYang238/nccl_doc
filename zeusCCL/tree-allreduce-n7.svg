<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Tree AllReduce — N = 7 二叉树</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#475569">两阶段流水：Reduce 上行（累加） + Broadcast 下行（复制）</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: Reduce 上行 -->
  <!-- ============================================================ -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="470" height="500" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <text x="235" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">① Reduce 上行（叶 → 根, depth=2 步）</text>

    <!-- Root rank 0 -->
    <circle cx="235" cy="80" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="235" y="78" text-anchor="middle" font-size="14" font-weight="bold">rank 0</text>
    <text x="235" y="92" text-anchor="middle" font-size="10" fill="#92400e">(root)</text>

    <!-- Internal: rank 1, 2 -->
    <circle cx="120" cy="220" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="218" text-anchor="middle" font-size="13" font-weight="bold">rank 1</text>
    <text x="120" y="232" text-anchor="middle" font-size="9" fill="#1e40af">(internal)</text>

    <circle cx="350" cy="220" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="350" y="218" text-anchor="middle" font-size="13" font-weight="bold">rank 2</text>
    <text x="350" y="232" text-anchor="middle" font-size="9" fill="#1e40af">(internal)</text>

    <!-- Leaves -->
    <circle cx="50" cy="360" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="50" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 3</text>

    <circle cx="190" cy="360" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="190" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 4</text>

    <circle cx="280" cy="360" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="280" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 5</text>

    <circle cx="420" cy="360" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="420" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 6</text>

    <!-- Arrows: leaves → internal (step 1) -->
    <path d="M 60 336 L 108 246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>
    <path d="M 180 336 L 132 246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>
    <path d="M 290 336 L 338 246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>
    <path d="M 410 336 L 362 246" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>

    <!-- Arrows: internal → root (step 2) -->
    <path d="M 134 196 L 221 108" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>
    <path d="M 336 196 L 249 108" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrUp)" fill="none"/>

    <!-- Step labels -->
    <rect x="10" y="318" width="50" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="3"/>
    <text x="35" y="333" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">step 1</text>

    <rect x="10" y="178" width="50" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="3"/>
    <text x="35" y="193" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">step 2</text>

    <!-- Value annotations -->
    <text x="50" y="402" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">V₃</text>
    <text x="190" y="402" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">V₄</text>
    <text x="280" y="402" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">V₅</text>
    <text x="420" y="402" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">V₆</text>

    <text x="120" y="270" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">V₁+V₃+V₄</text>
    <text x="350" y="270" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="bold">V₂+V₅+V₆</text>
    <text x="235" y="130" text-anchor="middle" font-size="12" fill="#d97706" font-weight="bold">V₀+V₁+…+V₆ = V</text>

    <!-- Caption -->
    <g transform="translate(20, 430)">
      <text x="0" y="0" font-size="11" fill="#334155">• 叶子：只发本地张量（<tspan font-weight="bold">0</tspan> 次加法）</text>
      <text x="0" y="18" font-size="11" fill="#334155">• 内部：收 k 个 child + 加本地 = <tspan font-weight="bold">k</tspan> 次加法（本例 k=2）</text>
      <text x="0" y="36" font-size="11" fill="#334155">• 根：收完所有 child + 加本地 → 写本地 recvbuff = 全和 V</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Broadcast 下行 -->
  <!-- ============================================================ -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="470" height="500" fill="#fff7ed" stroke="#fdba74" stroke-width="1" rx="8"/>
    <text x="235" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">② Broadcast 下行（根 → 叶, depth=2 步）</text>

    <!-- Root rank 0 -->
    <circle cx="235" cy="80" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="235" y="78" text-anchor="middle" font-size="14" font-weight="bold">rank 0</text>
    <text x="235" y="92" text-anchor="middle" font-size="10" fill="#92400e">(root)</text>

    <!-- Internal -->
    <circle cx="120" cy="220" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="218" text-anchor="middle" font-size="13" font-weight="bold">rank 1</text>
    <text x="120" y="232" text-anchor="middle" font-size="9" fill="#991b1b">(internal)</text>

    <circle cx="350" cy="220" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="350" y="218" text-anchor="middle" font-size="13" font-weight="bold">rank 2</text>
    <text x="350" y="232" text-anchor="middle" font-size="9" fill="#991b1b">(internal)</text>

    <!-- Leaves -->
    <circle cx="50" cy="360" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="50" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 3</text>

    <circle cx="190" cy="360" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="190" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 4</text>

    <circle cx="280" cy="360" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="280" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 5</text>

    <circle cx="420" cy="360" r="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="420" y="364" text-anchor="middle" font-size="12" font-weight="bold">rank 6</text>

    <!-- Arrows down: root → internal (step 1) -->
    <path d="M 221 108 L 134 196" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>
    <path d="M 249 108 L 336 196" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>

    <!-- Arrows down: internal → leaves (step 2) -->
    <path d="M 108 246 L 60 336" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>
    <path d="M 132 246 L 180 336" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>
    <path d="M 338 246 L 290 336" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>
    <path d="M 362 246 L 410 336" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrDown)" fill="none"/>

    <!-- Step labels -->
    <rect x="10" y="178" width="50" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
    <text x="35" y="193" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">step 1</text>

    <rect x="10" y="318" width="50" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
    <text x="35" y="333" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">step 2</text>

    <!-- Values: all get V -->
    <text x="235" y="130" text-anchor="middle" font-size="12" fill="#d97706" font-weight="bold">V (全和已就绪)</text>
    <text x="120" y="270" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">V</text>
    <text x="350" y="270" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">V</text>
    <text x="50" y="402" text-anchor="middle" font-size="11" fill="#db2777" font-weight="bold">V</text>
    <text x="190" y="402" text-anchor="middle" font-size="11" fill="#db2777" font-weight="bold">V</text>
    <text x="280" y="402" text-anchor="middle" font-size="11" fill="#db2777" font-weight="bold">V</text>
    <text x="420" y="402" text-anchor="middle" font-size="11" fill="#db2777" font-weight="bold">V</text>

    <!-- Caption -->
    <g transform="translate(20, 430)">
      <text x="0" y="0" font-size="11" fill="#334155">• 根：把 V 写到所有 child ringbuf（<tspan font-weight="bold">无算术</tspan>，纯字节搬运）</text>
      <text x="0" y="18" font-size="11" fill="#334155">• 内部：收 parent → 写本地 recvbuff → 转发到所有 child</text>
      <text x="0" y="36" font-size="11" fill="#334155">• 叶子：收 parent → 写本地 recvbuff（终点）</text>
    </g>
  </g>

  <!-- Bottom footer -->
  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    总步数 = 2 × depth = 4 步；与 Ring 的 2(N-1)=12 步相比，Tree 在 N=7 时延迟明显更低
  </text>
</svg>
