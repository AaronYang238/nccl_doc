<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dcArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Ring AllReduce ≡ ReduceScatter + AllGather</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#475569">两阶段共 2(N−1) 步；ReduceScatter 末步 + AllGather 首步在 zeusCCL Ring kernel 内可合并为单原语 recvReduceCopySend</text>

  <!-- ========================= STATE 1: Initial ========================= -->
  <g transform="translate(20, 90)">
    <text x="135" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">① 初始</text>
    <text x="135" y="18" text-anchor="middle" font-size="10" fill="#64748b">每 rank 持有完整张量（4 段）</text>

    <!-- 4x4 grid -->
    <g font-size="9" fill="#475569" text-anchor="middle">
      <text x="50" y="42">slot 0</text><text x="95" y="42">slot 1</text>
      <text x="140" y="42">slot 2</text><text x="185" y="42">slot 3</text>
    </g>
    <g font-size="10" font-weight="bold" text-anchor="end" fill="#1e293b">
      <text x="24" y="66">r0</text><text x="24" y="94">r1</text>
      <text x="24" y="122">r2</text><text x="24" y="150">r3</text>
    </g>
    <g font-size="9" text-anchor="middle">
      <rect x="28" y="52" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="50" y="67">X0₀</text>
      <rect x="73" y="52" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="95" y="67">X0₁</text>
      <rect x="118" y="52" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="140" y="67">X0₂</text>
      <rect x="163" y="52" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="67">X0₃</text>

      <rect x="28" y="80" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="50" y="95">X1₀</text>
      <rect x="73" y="80" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="95" y="95">X1₁</text>
      <rect x="118" y="80" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="140" y="95">X1₂</text>
      <rect x="163" y="80" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="95">X1₃</text>

      <rect x="28" y="108" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="50" y="123">X2₀</text>
      <rect x="73" y="108" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="95" y="123">X2₁</text>
      <rect x="118" y="108" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="140" y="123">X2₂</text>
      <rect x="163" y="108" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="123">X2₃</text>

      <rect x="28" y="136" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="50" y="151">X3₀</text>
      <rect x="73" y="136" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="95" y="151">X3₁</text>
      <rect x="118" y="136" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="140" y="151">X3₂</text>
      <rect x="163" y="136" width="45" height="22" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="151">X3₃</text>
    </g>

    <text x="135" y="185" text-anchor="middle" font-size="11" fill="#7c3aed">每段独立 = 4 个未归约 term</text>
  </g>

  <!-- ========================= Arrow 1: RS ========================= -->
  <g transform="translate(280, 200)">
    <path d="M 0 0 L 75 0" stroke="#0f172a" stroke-width="3" marker-end="url(#dcArr)" fill="none"/>
    <text x="42" y="-12" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Ring ReduceScatter</text>
    <text x="42" y="20" text-anchor="middle" font-size="11" fill="#475569">N−1 步</text>
    <text x="42" y="36" text-anchor="middle" font-size="11" fill="#475569">累加</text>
  </g>

  <!-- ========================= STATE 2: After RS ========================= -->
  <g transform="translate(380, 90)">
    <text x="135" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">② 仅 ReduceScatter 后</text>
    <text x="135" y="18" text-anchor="middle" font-size="10" fill="#64748b">每 rank 持有全和的 1 段</text>

    <g font-size="9" fill="#475569" text-anchor="middle">
      <text x="50" y="42">slot 0</text><text x="95" y="42">slot 1</text>
      <text x="140" y="42">slot 2</text><text x="185" y="42">slot 3</text>
    </g>
    <g font-size="10" font-weight="bold" text-anchor="end" fill="#1e293b">
      <text x="24" y="66">r0</text><text x="24" y="94">r1</text>
      <text x="24" y="122">r2</text><text x="24" y="150">r3</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <!-- diagonal full sums -->
      <rect x="28" y="52" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="50" y="67" font-weight="bold" fill="#065f46">S₀</text>
      <rect x="73" y="52" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="95" y="68" font-size="8" fill="#94a3b8">废</text>
      <rect x="118" y="52" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="140" y="68" font-size="8" fill="#94a3b8">废</text>
      <rect x="163" y="52" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="185" y="68" font-size="8" fill="#94a3b8">废</text>

      <rect x="28" y="80" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="50" y="96" font-size="8" fill="#94a3b8">废</text>
      <rect x="73" y="80" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="95" y="95" font-weight="bold" fill="#065f46">S₁</text>
      <rect x="118" y="80" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="140" y="96" font-size="8" fill="#94a3b8">废</text>
      <rect x="163" y="80" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="185" y="96" font-size="8" fill="#94a3b8">废</text>

      <rect x="28" y="108" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="50" y="124" font-size="8" fill="#94a3b8">废</text>
      <rect x="73" y="108" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="95" y="124" font-size="8" fill="#94a3b8">废</text>
      <rect x="118" y="108" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="140" y="123" font-weight="bold" fill="#065f46">S₂</text>
      <rect x="163" y="108" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="185" y="124" font-size="8" fill="#94a3b8">废</text>

      <rect x="28" y="136" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="50" y="152" font-size="8" fill="#94a3b8">废</text>
      <rect x="73" y="136" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="95" y="152" font-size="8" fill="#94a3b8">废</text>
      <rect x="118" y="136" width="45" height="22" fill="#f1f5f9" stroke="#cbd5e1"/><text x="140" y="152" font-size="8" fill="#94a3b8">废</text>
      <rect x="163" y="136" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="185" y="151" font-weight="bold" fill="#065f46">S₃</text>
    </g>

    <text x="135" y="185" text-anchor="middle" font-size="11" fill="#059669">对角线 = 全和段 S<tspan baseline-shift="sub" font-size="0.7em">r</tspan></text>
  </g>

  <!-- ========================= Arrow 2: AG ========================= -->
  <g transform="translate(640, 200)">
    <path d="M 0 0 L 75 0" stroke="#0f172a" stroke-width="3" marker-end="url(#dcArr)" fill="none"/>
    <text x="42" y="-12" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Ring AllGather</text>
    <text x="42" y="20" text-anchor="middle" font-size="11" fill="#475569">N−1 步</text>
    <text x="42" y="36" text-anchor="middle" font-size="11" fill="#475569">覆盖</text>
  </g>

  <!-- ========================= STATE 3: After AG (AllReduce final) ========================= -->
  <g transform="translate(740, 90)">
    <text x="135" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">③ AllReduce 完成</text>
    <text x="135" y="18" text-anchor="middle" font-size="10" fill="#64748b">每 rank 持有全部 4 段全和</text>

    <g font-size="9" fill="#475569" text-anchor="middle">
      <text x="50" y="42">slot 0</text><text x="95" y="42">slot 1</text>
      <text x="140" y="42">slot 2</text><text x="185" y="42">slot 3</text>
    </g>
    <g font-size="10" font-weight="bold" text-anchor="end" fill="#1e293b">
      <text x="24" y="66">r0</text><text x="24" y="94">r1</text>
      <text x="24" y="122">r2</text><text x="24" y="150">r3</text>
    </g>
    <g font-size="10" text-anchor="middle">
      <rect x="28" y="52" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="50" y="67" font-weight="bold" fill="#92400e">S₀</text>
      <rect x="73" y="52" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="67" font-weight="bold" fill="#92400e">S₁</text>
      <rect x="118" y="52" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="140" y="67" font-weight="bold" fill="#92400e">S₂</text>
      <rect x="163" y="52" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="185" y="67" font-weight="bold" fill="#92400e">S₃</text>

      <rect x="28" y="80" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="50" y="95" font-weight="bold" fill="#92400e">S₀</text>
      <rect x="73" y="80" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="95" font-weight="bold" fill="#92400e">S₁</text>
      <rect x="118" y="80" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="140" y="95" font-weight="bold" fill="#92400e">S₂</text>
      <rect x="163" y="80" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="185" y="95" font-weight="bold" fill="#92400e">S₃</text>

      <rect x="28" y="108" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="50" y="123" font-weight="bold" fill="#92400e">S₀</text>
      <rect x="73" y="108" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="123" font-weight="bold" fill="#92400e">S₁</text>
      <rect x="118" y="108" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="140" y="123" font-weight="bold" fill="#92400e">S₂</text>
      <rect x="163" y="108" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="185" y="123" font-weight="bold" fill="#92400e">S₃</text>

      <rect x="28" y="136" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="50" y="151" font-weight="bold" fill="#92400e">S₀</text>
      <rect x="73" y="136" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="151" font-weight="bold" fill="#92400e">S₁</text>
      <rect x="118" y="136" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="140" y="151" font-weight="bold" fill="#92400e">S₂</text>
      <rect x="163" y="136" width="45" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="185" y="151" font-weight="bold" fill="#92400e">S₃</text>
    </g>

    <text x="135" y="185" text-anchor="middle" font-size="11" fill="#d97706">所有 rank 持有完整全和</text>
  </g>

  <!-- ========================= Bottom: zeusCCL kernel mapping ========================= -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="1000" height="160" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
    <text x="500" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">zeusCCL 中的 kernel 映射（§6.2.6）</text>

    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="290" height="100" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
      <text x="145" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">ReduceScatter × Ring</text>
      <text x="10" y="44" font-size="10" fill="#334155">原语：send → recvReduceSend → recvReduce</text>
      <text x="10" y="62" font-size="10" fill="#334155">独立 kernel：可单独调用</text>
      <text x="10" y="80" font-size="10" fill="#334155">用途：DeepSpeed ZeRO-3 切分梯度</text>
    </g>

    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="290" height="100" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="6"/>
      <text x="145" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#0e7490">AllGather × Ring</text>
      <text x="10" y="44" font-size="10" fill="#334155">原语：copySend → recvCopySend → recv</text>
      <text x="10" y="62" font-size="10" fill="#334155">独立 kernel：可单独调用</text>
      <text x="10" y="80" font-size="10" fill="#334155">用途：DeepSpeed ZeRO-3 还原参数</text>
    </g>

    <g transform="translate(670, 50)">
      <rect x="0" y="0" width="290" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
      <text x="145" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">AllReduce × Ring</text>
      <text x="10" y="44" font-size="10" fill="#334155">= RS + AG，转折步合并为：</text>
      <text x="10" y="62" font-size="10" font-weight="bold" fill="#7c2d12">recvReduceCopySend</text>
      <text x="10" y="80" font-size="10" fill="#334155">单原语 = 一次内存读+一次写</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="550" y="490" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    三个 kernel 共用同一 comm-&gt;graphs[ring].channels[*]（同邻居、同 ringbuf），enqueue 按 collOp 分别路由
  </text>
</svg>
