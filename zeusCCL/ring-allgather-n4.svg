<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="agArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Ring AllGather — N = 4</text>
  <text x="550" y="50" text-anchor="middle" font-size="12" fill="#475569">沿环单向传 N−1 = 3 步；每段绕环一圈被广播给所有 rank；最终每 rank 拼齐 [D₀, D₁, D₂, D₃]</text>

  <!-- ============================================================ -->
  <!-- Ring topology -->
  <!-- ============================================================ -->
  <g transform="translate(380, 75)">
    <text x="170" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0891b2">环拓扑（顺时针）</text>
    <circle cx="80" cy="80" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="80" y="84" text-anchor="middle" font-size="13" font-weight="bold">r0</text>
    <circle cx="260" cy="80" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="260" y="84" text-anchor="middle" font-size="13" font-weight="bold">r1</text>
    <circle cx="260" cy="180" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="260" y="184" text-anchor="middle" font-size="13" font-weight="bold">r2</text>
    <circle cx="80" cy="180" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="80" y="184" text-anchor="middle" font-size="13" font-weight="bold">r3</text>
    <path d="M 108 80 L 232 80" stroke="#0891b2" stroke-width="2" marker-end="url(#agArr)" fill="none"/>
    <path d="M 260 108 L 260 152" stroke="#0891b2" stroke-width="2" marker-end="url(#agArr)" fill="none"/>
    <path d="M 232 180 L 108 180" stroke="#0891b2" stroke-width="2" marker-end="url(#agArr)" fill="none"/>
    <path d="M 80 152 L 80 108" stroke="#0891b2" stroke-width="2" marker-end="url(#agArr)" fill="none"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4 State Grids -->
  <!-- ============================================================ -->
  <g transform="translate(30, 310)">
    <!-- ===== Grid 1: Initial ===== -->
    <g transform="translate(0, 0)">
      <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">初始</text>
      <text x="115" y="16" text-anchor="middle" font-size="10" fill="#64748b">仅本 rank 那段有数据</text>

      <g font-size="9" fill="#475569" text-anchor="middle">
        <text x="40" y="40">slot 0</text><text x="85" y="40">slot 1</text>
        <text x="130" y="40">slot 2</text><text x="175" y="40">slot 3</text>
      </g>
      <g font-size="10" font-weight="bold" fill="#1e293b" text-anchor="end">
        <text x="14" y="64">r0</text><text x="14" y="92">r1</text>
        <text x="14" y="120">r2</text><text x="14" y="148">r3</text>
      </g>
      <g font-size="10" text-anchor="middle">
        <!-- diagonal filled -->
        <rect x="18" y="50" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="40" y="65" font-weight="bold" fill="#0e7490">D₀</text>
        <rect x="63" y="50" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="85" y="66" fill="#cbd5e1">—</text>
        <rect x="108" y="50" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="130" y="66" fill="#cbd5e1">—</text>
        <rect x="153" y="50" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="175" y="66" fill="#cbd5e1">—</text>

        <rect x="18" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="94" fill="#cbd5e1">—</text>
        <rect x="63" y="78" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="85" y="93" font-weight="bold" fill="#0e7490">D₁</text>
        <rect x="108" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="130" y="94" fill="#cbd5e1">—</text>
        <rect x="153" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="175" y="94" fill="#cbd5e1">—</text>

        <rect x="18" y="106" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="122" fill="#cbd5e1">—</text>
        <rect x="63" y="106" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="85" y="122" fill="#cbd5e1">—</text>
        <rect x="108" y="106" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="130" y="121" font-weight="bold" fill="#0e7490">D₂</text>
        <rect x="153" y="106" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="175" y="122" fill="#cbd5e1">—</text>

        <rect x="18" y="134" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="150" fill="#cbd5e1">—</text>
        <rect x="63" y="134" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="85" y="150" fill="#cbd5e1">—</text>
        <rect x="108" y="134" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="130" y="150" fill="#cbd5e1">—</text>
        <rect x="153" y="134" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="175" y="149" font-weight="bold" fill="#0e7490">D₃</text>
      </g>
      <text x="115" y="175" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">填充率 1/4</text>
    </g>

    <!-- ===== Grid 2: After Step 1 ===== -->
    <g transform="translate(265, 0)">
      <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">After step 1</text>
