        <rect x="108" y="134" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="130" y="149" font-weight="bold" fill="#155e75">D₂ ✦</text>
        <rect x="153" y="134" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="175" y="149" font-weight="bold" fill="#0e7490">D₃</text>
      </g>
      <text x="115" y="175" text-anchor="middle" font-size="10" fill="#0e7490" font-style="italic">填充率 2/4 (✦=新到)</text>
