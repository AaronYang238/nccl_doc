        <!-- r3: [_, _, D2 new, D3] -->
        <rect x="18" y="134" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="150" fill="#cbd5e1">—</text>
