        <!-- r0: [D0, _, D2 new, D3] -->
        <rect x="18" y="50" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="40" y="65" font-weight="bold" fill="#0e7490">D₀</text>
        <rect x="63" y="50" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="85" y="66" fill="#cbd5e1">—</text>
        <rect x="108" y="50" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="130" y="65" font-weight="bold" fill="#155e75">D₂ ✦</text>
        <rect x="153" y="50" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="175" y="65" font-weight="bold" fill="#0e7490">D₃</text>

        <!-- r1: [D0, D1, _, D3 new] -->
        <rect x="18" y="78" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="40" y="93" font-weight="bold" fill="#0e7490">D₀</text>
        <rect x="63" y="78" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="85" y="93" font-weight="bold" fill="#0e7490">D₁</text>
        <rect x="108" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="130" y="94" fill="#cbd5e1">—</text>
        <rect x="153" y="78" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="175" y="93" font-weight="bold" fill="#155e75">D₃ ✦</text>

        <!-- r2: [D0 new, D1, D2, _] -->
        <rect x="18" y="106" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="40" y="121" font-weight="bold" fill="#155e75">D₀ ✦</text>
        <rect x="63" y="106" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="85" y="121" font-weight="bold" fill="#0e7490">D₁</text>
        <rect x="108" y="106" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="130" y="121" font-weight="bold" fill="#0e7490">D₂</text>
        <rect x="153" y="106" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="175" y="122" fill="#cbd5e1">—</text>

        <!-- r3: [_, D1 new, D2, D3] -->
        <rect x="18" y="134" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="150" fill="#cbd5e1">—</text>
        <rect x="63" y="134" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="85" y="149" font-weight="bold" fill="#155e75">D₁ ✦</text>
        <rect x="108" y="134" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="130" y="149" font-weight="bold" fill="#0e7490">D₂</text>
        <rect x="153" y="134" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="175" y="149" font-weight="bold" fill="#0e7490">D₃</text>
      </g>
      <text x="115" y="175" text-anchor="middle" font-size="10" fill="#0e7490" font-style="italic">填充率 3/4</text>
    </g>

    <!-- ===== Grid 4: After Step 3 (final) ===== -->
    <g transform="translate(795, 0)">
      <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">After step 3 (终)</text>
      <text x="115" y="16" text-anchor="middle" font-size="10" fill="#64748b">所有 rank 拼齐 4 段</text>

      <g font-size="9" fill="#475569" text-anchor="middle">
        <text x="40" y="40">slot 0</text><text x="85" y="40">slot 1</text>
        <text x="130" y="40">slot 2</text><text x="175" y="40">slot 3</text>
      </g>
      <g font-size="10" font-weight="bold" fill="#1e293b" text-anchor="end">
        <text x="14" y="64">r0</text><text x="14" y="92">r1</text>
        <text x="14" y="120">r2</text><text x="14" y="148">r3</text>
      </g>
      <g font-size="10" text-anchor="middle">
        <!-- All filled with D values; new entries highlighted -->
        <rect x="18" y="50" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="40" y="65" font-weight="bold" fill="#065f46">D₀</text>
        <rect x="63" y="50" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="85" y="65" font-weight="bold" fill="#155e75">D₁ ✦</text>
        <rect x="108" y="50" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="130" y="65" font-weight="bold" fill="#065f46">D₂</text>
        <rect x="153" y="50" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="175" y="65" font-weight="bold" fill="#065f46">D₃</text>

        <rect x="18" y="78" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="40" y="93" font-weight="bold" fill="#065f46">D₀</text>
        <rect x="63" y="78" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="85" y="93" font-weight="bold" fill="#065f46">D₁</text>
        <rect x="108" y="78" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="130" y="93" font-weight="bold" fill="#155e75">D₂ ✦</text>
        <rect x="153" y="78" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="175" y="93" font-weight="bold" fill="#065f46">D₃</text>

        <rect x="18" y="106" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="40" y="121" font-weight="bold" fill="#065f46">D₀</text>
        <rect x="63" y="106" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="85" y="121" font-weight="bold" fill="#065f46">D₁</text>
        <rect x="108" y="106" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="130" y="121" font-weight="bold" fill="#065f46">D₂</text>
        <rect x="153" y="106" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="175" y="121" font-weight="bold" fill="#155e75">D₃ ✦</text>

        <rect x="18" y="134" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="40" y="149" font-weight="bold" fill="#155e75">D₀ ✦</text>
        <rect x="63" y="134" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="85" y="149" font-weight="bold" fill="#065f46">D₁</text>
        <rect x="108" y="134" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="130" y="149" font-weight="bold" fill="#065f46">D₂</text>
        <rect x="153" y="134" width="45" height="22" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="175" y="149" font-weight="bold" fill="#065f46">D₃</text>
