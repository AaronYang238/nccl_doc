  <!-- Legend -->
  <g transform="translate(50, 545)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#0f172a">图例：</text>
    <rect x="60" y="-12" width="20" height="14" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/>
    <text x="85" y="0" font-size="11" fill="#475569">空（未填）</text>

    <rect x="200" y="-12" width="20" height="14" fill="#cffafe" stroke="#0891b2"/>
    <text x="225" y="0" font-size="11" fill="#475569">初始本 rank 自己段</text>

    <rect x="370" y="-12" width="20" height="14" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/>
    <text x="395" y="0" font-size="11" fill="#475569">本步新到（✦）</text>

    <rect x="510" y="-12" width="20" height="14" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
    <text x="535" y="0" font-size="11" fill="#475569">已就绪（终态）</text>
  </g>

  <!-- Caption -->
  <g transform="translate(50, 600)">
    <text x="0" y="0" font-size="12" fill="#334155">
      <tspan font-weight="bold">算法约定：</tspan> step k 时 rank r 转发"上一步刚收到的段"（k=0 时转发自己的 D<tspan baseline-shift="sub" font-size="0.7em">r</tspan>）到 next。
    </text>
    <text x="0" y="22" font-size="12" fill="#334155">
      <tspan font-weight="bold">直觉：</tspan> 每段 D<tspan baseline-shift="sub" font-size="0.7em">r</tspan> 沿环单向走 N−1 圈（被 N−1 个其它 rank 经过）→ 所有 rank 都收到。与 ReduceScatter 对偶（"累加" → "覆盖"）。
    </text>
    <text x="0" y="44" font-size="12" fill="#334155">
      <tspan font-weight="bold">关系：</tspan> Ring AllReduce = ReduceScatter + AllGather；AllGather 通常以 ReduceScatter 的"对角线全和"作为初始输入。
    </text>
  </g>
</svg>
