    <!-- ===== Grid 3: After Step 2 ===== -->
    <g transform="translate(530, 0)">
      <text x="115" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">After step 2</text>
      <text x="115" y="16" text-anchor="middle" font-size="10" fill="#64748b">转发"上一步收到的段"</text>

      <g font-size="9" fill="#475569" text-anchor="middle">
        <text x="40" y="40">slot 0</text><text x="85" y="40">slot 1</text>
        <text x="130" y="40">slot 2</text><text x="175" y="40">slot 3</text>
      </g>
