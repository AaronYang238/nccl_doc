        <!-- r1: [D0 new, D1, _, _] -->
        <rect x="18" y="78" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="40" y="93" font-weight="bold" fill="#155e75">D₀ ✦</text>
        <rect x="63" y="78" width="45" height="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="85" y="93" font-weight="bold" fill="#0e7490">D₁</text>
        <rect x="108" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="130" y="94" fill="#cbd5e1">—</text>
        <rect x="153" y="78" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="175" y="94" fill="#cbd5e1">—</text>

        <!-- r2: [_, D1 new, D2, _] -->
        <rect x="18" y="106" width="45" height="22" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2 2"/><text x="40" y="122" fill="#cbd5e1">—</text>
        <rect x="63" y="106" width="45" height="22" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/><text x="85" y="121" font-weight="bold" fill="#155e75">D₁ ✦</text>
