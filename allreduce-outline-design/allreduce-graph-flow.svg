<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1280" height="1280" fill="#fafafa"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="640" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">graph 模块 — commInit 执行流程</text>
  <text x="640" y="58" text-anchor="middle" font-size="12" fill="#4b5563">7 步装配：从 XML 拓扑 + peerInfo 到双向 Ring 序列（数据结构定义见 allreduce-graph-datastructures.svg）</text>

  <!-- ===== Inputs ===== -->
  <g>
    <rect x="100" y="90" width="440" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
    <text x="320" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">XML 拓扑文件（可选输入）</text>
    <text x="320" y="131" text-anchor="middle" font-size="10" fill="#14532d">约定路径 / NCCL_TOPO_FILE</text>
    <text x="320" y="147" text-anchor="middle" font-size="10" fill="#14532d">存在 → 直接解析；不存在 → graph 现场扫描生成</text>
    <text x="320" y="162" text-anchor="middle" font-size="10" fill="#14532d">&lt;cpu&gt; → &lt;pci&gt; → &lt;gpu&gt; 层级 + PBLink 边</text>

    <rect x="600" y="90" width="440" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
    <text x="820" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">peerInfo[nranks]</text>
    <text x="820" y="135" text-anchor="middle" font-size="10" fill="#14532d">bootstrap 模块提供</text>
    <text x="820" y="152" text-anchor="middle" font-size="10" fill="#14532d">含 busId / pid / NUMA 归属</text>
  </g>

  <line x1="320" y1="170" x2="460" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="170" x2="700" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Step 1 ===== -->
  <g>
    <rect x="250" y="200" width="660" height="80" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="222" font-size="14" font-weight="bold" fill="#4c1d95">① 获取 XML 拓扑文件</text>
    <text x="280" y="241" font-size="10" fill="#4c1d95">路径：约定路径 / NCCL_TOPO_FILE 环境变量</text>
    <text x="280" y="257" font-size="10" fill="#4c1d95">存在 → 解析为内存拓扑树（&lt;cpu&gt; → &lt;pci&gt; → &lt;gpu&gt; 层级）</text>
    <text x="280" y="273" font-size="10" fill="#4c1d95">不存在 → 调 NVML / sysfs / /proc/cpuinfo 现场扫描 → 构建树并落盘，下次复用</text>
  </g>
  <g>
    <rect x="950" y="218" width="270" height="44" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="237" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">格式非法 / 现场扫描失败</text>
    <text x="1085" y="252" text-anchor="middle" font-size="9" fill="#991b1b">→ 装配失败 (ncclInternalError)</text>
  </g>
  <line x1="910" y1="240" x2="950" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="280" x2="580" y2="310" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 2 ===== -->
  <g>
    <rect x="250" y="310" width="660" height="85" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="335" font-size="14" font-weight="bold" fill="#4c1d95">② GPU 枚举与对齐</text>
    <text x="280" y="357" font-size="10" fill="#4c1d95">cudaGetDeviceCount + 通过 peerInfo 取其它 rank 的 busId / NUMA</text>
    <text x="280" y="373" font-size="10" fill="#4c1d95">按 busId 字符串与 XML GPU 节点对齐</text>
    <text x="280" y="389" font-size="10" fill="#4c1d95">→ 建立 rank → 拓扑节点 映射表</text>
  </g>
  <g>
    <rect x="950" y="333" width="270" height="44" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">rank 不在 XML / device 不在 XML</text>
    <text x="1085" y="367" text-anchor="middle" font-size="9" fill="#991b1b">→ 环境不匹配，装配失败</text>
  </g>
  <line x1="910" y1="355" x2="950" y2="355" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="395" x2="580" y2="425" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 3 ===== -->
  <g>
    <rect x="250" y="425" width="660" height="105" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="450" font-size="14" font-weight="bold" fill="#4c1d95">③ 填代价矩阵 cost[N][N]</text>
    <text x="280" y="472" font-size="10" fill="#4c1d95">① 拓扑树回溯 (GPU → PCIe switch → host bridge → CPU) → 距离类别</text>
    <text x="280" y="488" font-size="10" fill="#4c1d95">② 查 XML 中是否有 GPU-GPU 直连 PBLink 边</text>
    <text x="280" y="504" font-size="10" fill="#4c1d95">③ cudaDeviceCanAccessPeer 兜底，对角线 cost[i][i] = 0</text>
    <text x="280" y="520" font-size="10" fill="#4c1d95">代价值：1 (PBLink) / 5 (同 switch) / 10 (同 CPU) / 50 (跨 NUMA) / ∞ (不可达)</text>
  </g>

  <line x1="580" y1="530" x2="580" y2="560" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 4 ===== -->
  <g>
    <rect x="250" y="560" width="660" height="135" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="585" font-size="14" font-weight="bold" fill="#4c1d95">④ Ring 搜索 (最小代价 Hamilton 环)</text>

    <rect x="280" y="600" width="280" height="80" fill="#c4b5fd" rx="4"/>
    <text x="420" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">DFS + 剪枝 (首发)</text>
    <text x="420" y="640" text-anchor="middle" font-size="9" fill="#4c1d95">N ≤ 16，起点固定 rank 0</text>
    <text x="420" y="655" text-anchor="middle" font-size="9" fill="#4c1d95">剩余下界估计 + 回溯</text>
    <text x="420" y="670" text-anchor="middle" font-size="9" fill="#4c1d95">单向搜索打破镜像对称</text>

    <rect x="600" y="600" width="280" height="80" fill="#c4b5fd" rx="4"/>
    <text x="740" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">贪心 + 2-opt (兜底)</text>
    <text x="740" y="640" text-anchor="middle" font-size="9" fill="#4c1d95">DFS 超时时启用</text>
    <text x="740" y="655" text-anchor="middle" font-size="9" fill="#4c1d95">就近选边 → 闭环 → 2-opt</text>
    <text x="740" y="670" text-anchor="middle" font-size="9" fill="#4c1d95">(a-b, c-d) → (a-c, b-d)</text>

    <line x1="560" y1="640" x2="600" y2="640" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
  </g>
  <g>
    <rect x="950" y="618" width="270" height="44" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="637" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">所有 Hamilton 环都含 ∞ 边</text>
    <text x="1085" y="652" text-anchor="middle" font-size="9" fill="#991b1b">→ 装配失败</text>
  </g>
  <line x1="910" y1="640" x2="950" y2="640" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="695" x2="580" y2="725" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 5 ===== -->
  <g>
    <rect x="250" y="725" width="660" height="95" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="750" font-size="14" font-weight="bold" fill="#4c1d95">⑤ 环合法性校验</text>
    <text x="280" y="772" font-size="10" fill="#4c1d95">cost = 1 / 5 / 10 / 50 → 边可用，运行期 transport 走 P2P</text>
    <text x="280" y="788" font-size="10" fill="#4c1d95">cost = ∞ → graph 标记"需降级"，transport 走 SHM</text>
    <text x="280" y="804" font-size="10" fill="#4c1d95">需降级边超过阈值 → P2P 几乎失效 → 装配失败</text>
  </g>
  <g>
    <rect x="950" y="743" width="270" height="44" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="1085" y="762" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">超阈值 → 硬件配置异常</text>
    <text x="1085" y="777" text-anchor="middle" font-size="9" fill="#991b1b">→ 装配失败</text>
  </g>
  <line x1="910" y1="765" x2="950" y2="765" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 2"/>

  <line x1="580" y1="820" x2="580" y2="850" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 6 ===== -->
  <g>
    <rect x="250" y="850" width="660" height="110" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="875" font-size="14" font-weight="bold" fill="#4c1d95">⑥ 双向 Ring 输出 (nChannels = 2)</text>
    <text x="280" y="897" font-size="10" fill="#4c1d95">channels[0].ring（前向）: prev = ring_prev, next = ring_next, userRanks = [r0, r1, …, rN-1]</text>
    <text x="280" y="913" font-size="10" fill="#4c1d95">channels[1].ring（反向）: prev = ring_next, next = ring_prev, userRanks = [r0, rN-1, …, r1]</text>
    <text x="280" y="932" font-size="10" fill="#4c1d95">chunk 顺序对齐: prev/next 互换 + userRanks 翻转</text>
    <text x="280" y="948" font-size="10" fill="#4c1d95">→ 两 channel 走相反方向，分别用 PBLink 两个物理方向独立推进数据</text>
  </g>

  <line x1="580" y1="960" x2="580" y2="990" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 7 ===== -->
  <g>
    <rect x="250" y="990" width="660" height="65" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="280" y="1015" font-size="14" font-weight="bold" fill="#4c1d95">⑦ 结果落地</text>
    <text x="280" y="1035" font-size="10" fill="#4c1d95">写入 comm-&gt;channels[0..1].ring.{prev, next, userRanks}</text>
    <text x="280" y="1051" font-size="10" fill="#4c1d95">graph 模块工作完成，运行期不再调用任何 graph 代码</text>
  </g>

  <line x1="580" y1="1055" x2="580" y2="1085" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Output ===== -->
  <g>
    <rect x="250" y="1085" width="660" height="60" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="580" y="1110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">输出：comm-&gt;channels[0..1].ring</text>
    <text x="580" y="1130" text-anchor="middle" font-size="10" fill="#7c2d12">{ prev, next, userRanks[] } × 2 （前向 + 反向），装配后固化，运行期只读</text>
  </g>

  <!-- ===== Legend ===== -->
  <g>
    <rect x="100" y="1180" width="1080" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
    <text x="120" y="1205" font-size="11" font-weight="bold" fill="#374151">图例：</text>

    <rect x="170" y="1195" width="20" height="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="200" y="1207" font-size="10" fill="#374151">输入</text>

    <rect x="260" y="1195" width="20" height="14" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="290" y="1207" font-size="10" fill="#374151">执行步骤</text>

    <rect x="370" y="1195" width="20" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="400" y="1207" font-size="10" fill="#374151">失败分支（虚线 + 红边）</text>

    <rect x="560" y="1195" width="20" height="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="590" y="1207" font-size="10" fill="#374151">输出</text>

    <text x="120" y="1235" font-size="10" fill="#6b7280">关键性质：7 步全部在 commInit 期间执行一次，运行期 graph 模块不再活跃；任一步失败 → comm-&gt;state = Failed，需 commDestroy 后重新 commInit。</text>
  </g>

</svg>
