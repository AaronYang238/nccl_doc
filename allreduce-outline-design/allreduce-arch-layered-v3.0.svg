<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1400" height="1120" fill="#fafafa"/>

  <!-- ===== Title ===== -->
  <text x="700" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">AllReduce 库 — 分层架构（transport 含 NET 后端 + proxy 线程 = 运行期组件）</text>
  <text x="700" y="52" text-anchor="middle" font-size="12" fill="#4b5563">(单机多卡 + 跨节点 · Ring 算法 · Simple 协议 · 装配重 / 热路径轻 · proxy 隶属 transport,不是独立模块)</text>

  <!-- ===== L1: API 层 ===== -->
  <g>
    <rect x="20" y="65" width="100" height="125" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="6"/>
    <text x="70" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">API 层</text>
    <text x="70" y="143" text-anchor="middle" font-size="9" fill="#7c2d12">稳定 ABI 边界</text>
    <text x="70" y="159" text-anchor="middle" font-size="9" fill="#7c2d12">隔离内部实现</text>

    <rect x="140" y="65" width="1080" height="125" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="6"/>

    <rect x="160" y="85" width="280" height="85" fill="#fdba74" rx="4"/>
    <text x="300" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">生命周期 (4)</text>
    <text x="300" y="140" text-anchor="middle" font-size="10" fill="#7c2d12">为 communicator 提供创建 / 销毁</text>
    <text x="300" y="155" text-anchor="middle" font-size="10" fill="#7c2d12">/ 异常退出四个生命周期入口</text>

    <rect x="455" y="85" width="280" height="85" fill="#fdba74" rx="4"/>
    <text x="595" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">集合通信 (1)</text>
    <text x="595" y="140" text-anchor="middle" font-size="10" fill="#7c2d12">执行多 GPU 张量归约的</text>
    <text x="595" y="155" text-anchor="middle" font-size="10" fill="#7c2d12">唯一对外原语</text>

    <rect x="750" y="85" width="450" height="85" fill="#fdba74" rx="4"/>
    <text x="975" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">查询 / 错误 (5)</text>
    <text x="975" y="140" text-anchor="middle" font-size="10" fill="#7c2d12">查询 comm 元信息（rank / nranks / 版本）</text>
    <text x="975" y="155" text-anchor="middle" font-size="10" fill="#7c2d12">与运行期错误状态（含 proxy 上报的 NET 异常）</text>
  </g>

  <!-- ===== L2: 调度层 ===== -->
  <g>
    <rect x="20" y="205" width="100" height="105" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="6"/>
    <text x="70" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">调度层</text>
    <text x="70" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">enqueue</text>
    <text x="70" y="284" text-anchor="middle" font-size="9" fill="#78350f">把用户调用</text>
    <text x="70" y="298" text-anchor="middle" font-size="9" fill="#78350f">翻译成 kernel 提交</text>

    <rect x="140" y="205" width="1080" height="105" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" rx="6"/>

    <rect x="160" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="272" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">① 参数校验</text>
    <text x="272" y="275" text-anchor="middle" font-size="9" fill="#78350f">拦截非法参数，避免破坏后续状态</text>

    <line x1="390" y1="257" x2="413" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="420,257 410,252 410,262" fill="#78350f"/>

    <rect x="425" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="537" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">② 查档位 + chunkSize</text>
    <text x="537" y="275" text-anchor="middle" font-size="9" fill="#78350f">按消息大小选合适的并行度</text>

    <line x1="655" y1="257" x2="678" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="685,257 675,252 675,262" fill="#78350f"/>

    <rect x="690" y="225" width="225" height="65" fill="#fcd34d" rx="4"/>
    <text x="802" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">③ 填 ncclWorkElem</text>
    <text x="802" y="275" text-anchor="middle" font-size="9" fill="#78350f">把 host 参数打包成 GPU 可读描述符</text>

    <line x1="920" y1="257" x2="943" y2="257" stroke="#78350f" stroke-width="2.5"/>
    <polygon points="950,257 940,252 940,262" fill="#78350f"/>

    <rect x="955" y="225" width="245" height="65" fill="#fcd34d" rx="4"/>
    <text x="1077" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">④ dispatch + LaunchKernel</text>
    <text x="1077" y="275" text-anchor="middle" font-size="9" fill="#78350f">按 (op, dtype) 选 kernel 提交到 stream</text>
  </g>

  <!-- ===== L3: GPU 内核层 ===== -->
  <g>
    <rect x="20" y="325" width="100" height="140" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="6"/>
    <text x="70" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">GPU 内核层</text>
    <text x="70" y="412" text-anchor="middle" font-size="9" fill="#1e3a8a">唯一在 GPU 上</text>
    <text x="70" y="428" text-anchor="middle" font-size="9" fill="#1e3a8a">运行的代码</text>

    <rect x="140" y="325" width="1080" height="140" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="6"/>

    <rect x="160" y="345" width="280" height="100" fill="#93c5fd" rx="4"/>
    <text x="300" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">allreduce_ring_simple.cu</text>
    <text x="300" y="410" text-anchor="middle" font-size="10" fill="#1e3a8a">Ring 算法 2N-1 步原语的 GPU 实现</text>
    <text x="300" y="425" text-anchor="middle" font-size="10" fill="#1e3a8a">(op × dtype)</text>

    <rect x="455" y="345" width="220" height="100" fill="#93c5fd" rx="4"/>
    <text x="565" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">prims_simple.h</text>
    <text x="565" y="415" text-anchor="middle" font-size="10" fill="#1e3a8a">跨 GPU 写者-读者</text>
    <text x="565" y="430" text-anchor="middle" font-size="10" fill="#1e3a8a">无锁同步原语</text>

    <rect x="690" y="345" width="220" height="100" fill="#93c5fd" rx="4"/>
    <text x="800" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">reduce_kernel.h</text>
    <text x="800" y="415" text-anchor="middle" font-size="10" fill="#1e3a8a">element-wise</text>
    <text x="800" y="430" text-anchor="middle" font-size="10" fill="#1e3a8a">归约操作集合</text>

    <rect x="925" y="345" width="280" height="100" fill="#93c5fd" rx="4"/>
    <text x="1065" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">common_kernel.h</text>
    <text x="1065" y="415" text-anchor="middle" font-size="10" fill="#1e3a8a">GPU 通用工具：</text>
    <text x="1065" y="430" text-anchor="middle" font-size="10" fill="#1e3a8a">内存屏障等</text>
  </g>

  <!-- ===== L4: 传输层 (装配期入口 + 3 个后端,NET 内嵌 proxy 运行期组件) ===== -->
  <g>
    <rect x="20" y="480" width="100" height="220" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" rx="6"/>
    <text x="70" y="555" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">传输层</text>
    <text x="70" y="582" text-anchor="middle" font-size="9" fill="#14532d">把远端 buffer</text>
    <text x="70" y="597" text-anchor="middle" font-size="9" fill="#14532d">映射进本端 VA;</text>
    <text x="70" y="615" text-anchor="middle" font-size="9" fill="#14532d">含 NET 跨节点</text>
    <text x="70" y="630" text-anchor="middle" font-size="9" fill="#14532d">RDMA 后端</text>
    <text x="70" y="650" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">含 proxy 运行期</text>
    <text x="70" y="665" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">组件（隶属本层）</text>

    <!-- transport 大容器,包含 connect + 3 backend rows -->
    <rect x="140" y="480" width="1080" height="220" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="6"/>

    <!-- 装配期入口 (顶部, 跨整宽) -->
    <rect x="160" y="497" width="1040" height="55" fill="#bbf7d0" stroke="#14532d" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="680" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">transport.connect</text>
    <text x="680" y="540" text-anchor="middle" font-size="10" font-style="italic" fill="#14532d">[装配期入口 · 仅 commInit · 读 graph 标签后分发到 P2P / SHM / NET 三分支建立通路]</text>

    <!-- 同节点后端 (P2P + SHM): 中间一行 -->
    <rect x="160" y="565" width="510" height="60" fill="#86efac" rx="4"/>
    <text x="415" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">P2P 主路径（同节点 · 运行期）</text>
    <text x="415" y="604" text-anchor="middle" font-size="9" font-style="italic" fill="#14532d">[运行期 host 不参与]</text>
    <text x="415" y="619" text-anchor="middle" font-size="9" fill="#14532d">kernel 直接 store / load 远端 GPU 显存 (CUDA IPC + PBLink / PCIe)</text>

    <rect x="685" y="565" width="515" height="60" fill="#86efac" rx="4"/>
    <text x="942" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">SHM 备用路径（同节点 · 运行期）</text>
    <text x="942" y="604" text-anchor="middle" font-size="9" font-style="italic" fill="#14532d">[运行期 host 不参与]</text>
    <text x="942" y="619" text-anchor="middle" font-size="9" fill="#14532d">经 host /dev/shm 共享内存中转（IPC 不可用时降级）</text>

    <!-- NET 后端: 底部一行,内含 proxy 运行期子组件 -->
    <rect x="160" y="635" width="1040" height="55" fill="#4ade80" stroke="#14532d" stroke-width="2" rx="4"/>
    <text x="200" y="657" font-size="13" font-weight="bold" fill="#14532d">NET 跨节点路径（RDMA verbs · InfiniBand / RoCEv2）</text>
    <text x="200" y="677" font-size="9" fill="#14532d">装配期建 QP / MR / 交换 GID·rkey；运行期由本层 proxy 子组件驱动</text>

    <!-- proxy 子框: 嵌在 NET 行右侧,显示"运行期组件,隶属 transport NET" -->
    <rect x="845" y="643" width="345" height="40" fill="#16a34a" stroke="#14532d" stroke-width="2" rx="4"/>
    <text x="1017" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">↳ proxy 线程（NET 运行期组件）</text>
    <text x="1017" y="675" text-anchor="middle" font-size="8.5" fill="#ffffff">host 常驻线程 · 隶属 transport · 不是独立模块 · §6.2.7</text>

    <!-- "嵌套"视觉提示:从 NET 标签到 proxy 子框的一条小连接线 -->
    <line x1="700" y1="660" x2="845" y2="663" stroke="#14532d" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- ===== L5: 算法层 (graph) ===== -->
  <g>
    <rect x="20" y="715" width="100" height="120" fill="#faf5ff" stroke="#9333ea" stroke-width="2" rx="6"/>
    <text x="70" y="770" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">算法层</text>
    <text x="70" y="795" text-anchor="middle" font-size="9" fill="#4c1d95">把拓扑复杂性</text>
    <text x="70" y="810" text-anchor="middle" font-size="9" fill="#4c1d95">消化成最优环</text>

    <rect x="140" y="715" width="1080" height="120" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" rx="6"/>

    <rect x="160" y="735" width="340" height="80" fill="#c4b5fd" rx="4"/>
    <text x="330" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">topo</text>
    <text x="330" y="792" text-anchor="middle" font-size="10" fill="#4c1d95">解析硬件拓扑（含 hostHash + RDMA HCA）</text>

    <rect x="520" y="735" width="340" height="80" fill="#c4b5fd" rx="4"/>
    <text x="690" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">search</text>
    <text x="690" y="792" text-anchor="middle" font-size="10" fill="#4c1d95">搜出最优 Hamilton 环（含跨节点边）</text>

    <rect x="880" y="735" width="320" height="80" fill="#c4b5fd" rx="4"/>
    <text x="1040" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">transport 后端标签</text>
    <text x="1040" y="792" text-anchor="middle" font-size="10" fill="#4c1d95">按 cost 贴 P2P / SHM / <tspan font-weight="bold" fill="#14532d">NET</tspan> 三类标签</text>
  </g>

  <!-- ===== L6: 装配编排层 ===== -->
  <g>
    <rect x="20" y="850" width="100" height="155" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="6"/>
    <text x="70" y="915" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">装配编排层</text>
    <text x="70" y="943" text-anchor="middle" font-size="9" fill="#1f2937">装配编排</text>
    <text x="70" y="958" text-anchor="middle" font-size="9" fill="#1f2937">+ 生命周期管理</text>

    <rect x="140" y="850" width="1080" height="155" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6"/>

    <rect x="160" y="870" width="340" height="115" fill="#d1d5db" rx="4"/>
    <text x="330" y="915" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">bootstrap</text>
    <text x="330" y="938" text-anchor="middle" font-size="9" fill="#1f2937">rank 进程间会合 + 身份信息交换</text>
    <text x="330" y="954" text-anchor="middle" font-size="9" fill="#1f2937">UDS（同节点）/ TCP（跨节点）</text>

    <rect x="520" y="870" width="340" height="115" fill="#d1d5db" rx="4"/>
    <text x="690" y="915" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">comm-init</text>
    <text x="690" y="938" text-anchor="middle" font-size="9" fill="#1f2937">串联装配链 + 维护状态机</text>
    <text x="690" y="954" text-anchor="middle" font-size="9" fill="#1f2937">含 ProxyStarting 状态</text>

    <rect x="880" y="870" width="320" height="115" fill="#d1d5db" rx="4"/>
    <text x="1040" y="915" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">channel + devComm</text>
    <text x="1040" y="938" text-anchor="middle" font-size="9" fill="#1f2937">装配产物容器 + 打包送上 GPU</text>
    <text x="1040" y="954" text-anchor="middle" font-size="9" fill="#1f2937">(proxy 字段不放进 ncclDevComm)</text>
  </g>

  <!-- ===== Right vertical column: cross-cutting concerns ===== -->
  <g>
    <rect x="1240" y="65" width="140" height="940" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="6"/>
    <text x="1310" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#164e63">跨层服务</text>

    <rect x="1260" y="110" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">ringbuf 协议</text>
    <text x="1310" y="178" text-anchor="middle" font-size="9" fill="#164e63">GPU 间无锁同步</text>
    <text x="1310" y="192" text-anchor="middle" font-size="9" fill="#164e63">的基础设施</text>

    <rect x="1260" y="225" width="100" height="90" fill="#67e8f9" rx="4"/>
    <text x="1310" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">CUDA stream</text>
    <text x="1310" y="290" text-anchor="middle" font-size="9" fill="#164e63">异步完成语义</text>
    <text x="1310" y="304" text-anchor="middle" font-size="9" fill="#164e63">的载体</text>

    <rect x="1260" y="330" width="100" height="110" fill="#67e8f9" rx="4"/>
    <text x="1310" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">异常逃生</text>
    <text x="1310" y="385" text-anchor="middle" font-size="9" fill="#164e63">hang / 错误的</text>
    <text x="1310" y="399" text-anchor="middle" font-size="9" fill="#164e63">统一逃生通道</text>
    <text x="1310" y="418" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">NET 路径挂钩点:</text>
    <text x="1310" y="431" text-anchor="middle" font-size="8.5" fill="#0c4a6e">proxy 写 fatalError</text>

    <rect x="1260" y="455" width="100" height="100" fill="#67e8f9" rx="4"/>
    <text x="1310" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">日志</text>
    <text x="1310" y="520" text-anchor="middle" font-size="9" fill="#164e63">运行期可观测</text>
    <text x="1310" y="534" text-anchor="middle" font-size="9" fill="#164e63">的窗口</text>

    <rect x="1260" y="570" width="100" height="80" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">NVTX</text>
    <text x="1310" y="630" text-anchor="middle" font-size="9" fill="#164e63">性能 profiling 标记</text>

    <rect x="1260" y="665" width="100" height="110" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="700" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">环境变量</text>
    <text x="1310" y="730" text-anchor="middle" font-size="9" fill="#164e63">运行期开关</text>
    <text x="1310" y="744" text-anchor="middle" font-size="9" fill="#164e63">与配置的入口</text>

    <rect x="1260" y="790" width="100" height="100" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="825" text-anchor="middle" font-size="12" font-weight="bold" fill="#164e63">拓扑导出</text>
    <text x="1310" y="855" text-anchor="middle" font-size="9" fill="#164e63">首扫后落盘</text>
    <text x="1310" y="869" text-anchor="middle" font-size="9" fill="#164e63">避免重扫</text>

    <rect x="1260" y="905" width="100" height="90" fill="#a5f3fc" rx="4"/>
    <text x="1310" y="935" text-anchor="middle" font-size="11" font-weight="bold" fill="#164e63">RDMA verbs</text>
    <text x="1310" y="950" text-anchor="middle" font-size="9" fill="#164e63">(NET 后端依赖)</text>
    <text x="1310" y="968" text-anchor="middle" font-size="9" fill="#164e63">libibverbs +</text>
    <text x="1310" y="982" text-anchor="middle" font-size="9" fill="#164e63">librdmacm</text>
  </g>

  <!-- ===== Dashed dividers between layers ===== -->
  <line x1="20" y1="197" x2="1220" y2="197" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="317" x2="1220" y2="317" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="472" x2="1220" y2="472" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="707" x2="1220" y2="707" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="842" x2="1220" y2="842" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===== Caption ===== -->
  <text x="20" y="1038" font-size="11" fill="#666">数据流: API ↓ 调度 ↓ GPU 内核 ↔ 传输 (运行期主体) — transport.connect / 算法层 / 装配编排层 仅 commInit 期活跃 — 右侧跨层服务伴随 communicator 全生命周期</text>
  <text x="20" y="1056" font-size="11" fill="#666">色块: 🟠 API · 🟡 调度 · 🔵 GPU 内核 · 🟢 传输（P2P / SHM / <tspan font-weight="bold" fill="#14532d">NET 含 proxy 子组件</tspan>） · 🟣 算法 · ⚫ 装配编排 · 🔵 跨层服务</text>
  <text x="20" y="1078" font-size="10" font-style="italic" fill="#888">设计要点: ① transport 层 3 后端 (P2P / SHM / NET 跨节点 RDMA);② NET 后端内嵌 proxy 运行期组件 (深绿子框,隶属 transport 层,不是独立模块);③ bootstrap 同节点 UDS + 跨节点 TCP;④ comm-init 状态机含 ProxyStarting</text>
  <text x="20" y="1098" font-size="10" font-style="italic" fill="#0c4a6e">关键提醒: proxy 不是与 bootstrap/graph/transport/enqueue/device/comm 并列的第七个模块——它是 transport NET 后端的"运行期 host 侧执行体",所有输入来自 transport 装配期产物</text>
